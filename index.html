<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Outpost CRM</title>
  <style>
    /* ==========================================================================
       OUTPOST CRM — NAVY & CRISP WHITE DESIGN SYSTEM (100% OFFLINE)
       ========================================================================== */
    :root {
      --navy-950: #0f1d30;
      --navy-900: #16263d;
      --navy-800: #1e3352;
      --navy-700: #294369;
      --navy-border: rgba(255, 255, 255, 0.09);

      --bg-canvas: #f4f6f9;
      --bg-surface: #ffffff;
      --bg-subtle: #f8fafc;
      --bg-hover: #f1f5f9;

      --border: #e2e8f0;
      --border-strong: #cbd5e1;

      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --text-light: #94a3b8;

      --emerald-600: #16a34a;
      --emerald-700: #15803d;
      --emerald-50: #f0fdf4;
      --emerald-100: #dcfce7;

      --blue-600: #2563eb;
      --blue-50: #eff6ff;
      --purple-600: #7c3aed;
      --purple-50: #f5f3ff;
      --amber-500: #f59e0b;
      --amber-600: #d97706;
      --amber-50: #fffbeb;
      --orange-600: #ea580c;
      --orange-50: #fff7ed;
      --red-600: #dc2626;
      --red-50: #fef2f2;
      --slate-500: #64748b;

      --sidebar-w: 238px;
      --topbar-h: 58px;
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 10px;
      --radius-xl: 12px;

      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.08), 0 1px 3px rgba(15, 23, 42, 0.04);
      --shadow-lg: 0 18px 40px rgba(15, 23, 42, 0.16), 0 4px 12px rgba(15, 23, 42, 0.06);

      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      font-family: var(--font-sans);
      font-size: 13px;
      line-height: 1.45;
      color: var(--text-primary);
      background: var(--bg-canvas);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    .tabular { font-variant-numeric: tabular-nums; }

    button, input, select, textarea {
      font-family: inherit;
      font-size: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
    }

    ::-webkit-scrollbar { width: 7px; height: 7px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 99px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    /* ==========================================================================
       APP SHELL & NAVY SIDEBAR
       ========================================================================== */
    .app-shell {
      display: flex;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .sidebar {
      width: var(--sidebar-w);
      min-width: var(--sidebar-w);
      background: linear-gradient(180deg, var(--navy-900) 0%, var(--navy-950) 100%);
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      height: 100%;
      user-select: none;
      z-index: 40;
      transition: transform 0.2s ease;
    }

    .sidebar-brand {
      height: var(--topbar-h);
      padding: 0 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--navy-border);
    }

    .brand-mark {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: linear-gradient(135deg, #2563eb 0%, #16a34a 100%);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    }

    .brand-name {
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.01em;
    }

    .sidebar-user-wrap {
      padding: 12px 12px 10px;
      border-bottom: 1px solid var(--navy-border);
    }

    .sidebar-user-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 10px;
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #ffffff;
      text-align: left;
      transition: background 0.14s, border-color 0.14s;
    }

    .sidebar-user-btn:hover {
      background: rgba(255, 255, 255, 0.11);
      border-color: rgba(255, 255, 255, 0.16);
    }

    .user-avatar {
      width: 30px;
      height: 30px;
      border-radius: 99px;
      background: #2563eb;
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .user-meta { min-width: 0; flex: 1; }
    .user-meta-name {
      font-size: 12.5px;
      font-weight: 600;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .user-meta-sub {
      font-size: 11px;
      color: #94a3b8;
    }

    .sidebar-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 12px 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 16px;
    }

    .sidebar-scroll::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.16);
    }

    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .nav-item {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 11px;
      border-radius: var(--radius-md);
      color: #cbd5e1;
      font-size: 13px;
      font-weight: 500;
      text-align: left;
      transition: background 0.12s, color 0.12s;
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }

    .nav-item.active {
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      font-weight: 600;
      box-shadow: inset 3px 0 0 #22c55e;
    }

    .nav-item-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .nav-icon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      opacity: 0.85;
    }

    .nav-item.active .nav-icon { opacity: 1; }

    .nav-badge {
      font-size: 11px;
      font-weight: 600;
      color: #cbd5e1;
      background: rgba(255, 255, 255, 0.1);
      padding: 1px 7px;
      border-radius: 99px;
      font-variant-numeric: tabular-nums;
    }

    .sidebar-shortcuts {
      border-top: 1px solid var(--navy-border);
      padding-top: 12px;
    }

    .sidebar-section-label {
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #64748b;
      padding: 0 11px 6px;
    }

    .shortcut-item {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 11px;
      border-radius: var(--radius-md);
      color: #cbd5e1;
      font-size: 12.5px;
      font-weight: 500;
      text-align: left;
      transition: background 0.12s, color 0.12s;
    }

    .shortcut-item:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }

    .shortcut-item.active {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      font-weight: 600;
    }

    .shortcut-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 1px 7px;
      border-radius: 99px;
      font-variant-numeric: tabular-nums;
    }

    .shortcut-badge.neutral { background: rgba(255, 255, 255, 0.12); color: #e2e8f0; }
    .shortcut-badge.red { background: rgba(239, 68, 68, 0.22); color: #fca5a5; }
    .shortcut-badge.blue { background: rgba(59, 130, 246, 0.25); color: #93c5fd; }

    /* ==========================================================================
       MAIN AREA & TOP HEADER BAR
       ========================================================================== */
    .main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      height: 100%;
      background: var(--bg-canvas);
    }

    .topbar {
      height: var(--topbar-h);
      min-height: var(--topbar-h);
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      z-index: 20;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .mobile-menu-btn {
      display: none;
      width: 34px;
      height: 34px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
    }

    .topbar-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    .search-trigger {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      height: 34px;
      min-width: 230px;
      padding: 0 11px;
      border-radius: var(--radius-md);
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 12.5px;
      transition: border-color 0.12s, background 0.12s;
    }

    .search-trigger:hover {
      border-color: var(--border-strong);
      background: #ffffff;
    }

    .kbd {
      font-size: 10.5px;
      font-weight: 600;
      color: var(--text-muted);
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 5px;
      box-shadow: 0 1px 0 var(--border);
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: nowrap;
    }

    .view-toggle {
      display: inline-flex;
      align-items: center;
      background: var(--bg-canvas);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 2px;
      height: 34px;
    }

    .view-toggle-btn {
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.12s;
    }

    .view-toggle-btn.active {
      background: #ffffff;
      color: var(--text-primary);
      box-shadow: var(--shadow-sm);
    }

    .currency-group {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      position: relative;
    }

    .currency-pill {
      display: inline-flex;
      align-items: center;
      background: var(--bg-canvas);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 2px;
      height: 34px;
    }

    .currency-btn {
      padding: 4px 9px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .currency-btn.active {
      background: #ffffff;
      color: var(--text-primary);
      box-shadow: var(--shadow-sm);
    }

    .rate-btn {
      height: 34px;
      padding: 0 9px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--text-secondary);
      font-size: 11.5px;
      font-weight: 600;
      white-space: nowrap;
    }
    .rate-btn:hover { background: var(--bg-subtle); border-color: var(--border-strong); }

    .btn-emerald {
      height: 34px;
      padding: 0 14px;
      border-radius: var(--radius-md);
      background: var(--emerald-600);
      color: #ffffff;
      font-size: 12.5px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      box-shadow: var(--shadow-sm);
      transition: background 0.12s;
    }
    .btn-emerald:hover { background: var(--emerald-700); }

    .btn-secondary {
      height: 34px;
      padding: 0 12px;
      border-radius: var(--radius-md);
      background: #ffffff;
      border: 1px solid var(--border);
      color: var(--text-primary);
      font-size: 12.5px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: background 0.12s, border-color 0.12s;
    }
    .btn-secondary:hover { background: var(--bg-subtle); border-color: var(--border-strong); }

    .btn-danger {
      height: 34px;
      padding: 0 13px;
      border-radius: var(--radius-md);
      background: var(--red-600);
      color: #ffffff;
      font-size: 12.5px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .btn-danger:hover { background: #b91c1c; }

    .btn-danger-soft {
      height: 34px;
      padding: 0 13px;
      border-radius: var(--radius-md);
      background: var(--red-50);
      border: 1px solid #fecaca;
      color: var(--red-600);
      font-size: 12.5px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-danger-soft:hover { background: #fee2e2; }

    .view-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .view-scroll {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
    }

    /* ==========================================================================
       EMPTY STATES
       ========================================================================== */
    .empty-state {
      max-width: 480px;
      margin: 48px auto;
      padding: 32px 28px;
      background: #ffffff;
      border: 1px dashed var(--border-strong);
      border-radius: var(--radius-xl);
      text-align: center;
      box-shadow: var(--shadow-sm);
    }

    .empty-icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 14px;
      border-radius: 12px;
      background: var(--bg-canvas);
      color: var(--navy-900);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .empty-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 6px;
    }

    .empty-desc {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 18px;
      line-height: 1.5;
    }

    /* ==========================================================================
       SECTION 1: ÚKOLY (BOARD + TIMELINE + LIST)
       ========================================================================== */
    .sub-toolbar {
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .sub-toolbar-stats {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12.5px;
      color: var(--text-muted);
      flex-wrap: wrap;
    }

    .sub-toolbar-stats strong { color: var(--text-primary); }

    .board-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(5, minmax(252px, 1fr));
      gap: 12px;
      padding: 16px 20px;
      overflow-x: auto;
      overflow-y: hidden;
    }

    .board-col {
      display: flex;
      flex-direction: column;
      background: #eef2f6;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      min-height: 0;
      max-height: 100%;
      transition: border-color 0.15s, background 0.15s;
    }

    .board-col.col-today {
      background: #ffffff;
      border-color: #bfdbfe;
      box-shadow: 0 2px 10px rgba(37, 99, 235, 0.06);
    }

    .board-col.drag-over {
      border-color: var(--blue-600);
      background: #eff6ff;
    }

    .board-col-header {
      padding: 11px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(15, 23, 42, 0.06);
    }

    .col-title-group {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .col-dot {
      width: 8px;
      height: 8px;
      border-radius: 99px;
      flex-shrink: 0;
    }

    .col-title { font-size: 13px; font-weight: 700; color: var(--text-primary); }

    .col-count {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-secondary);
      background: rgba(15, 23, 42, 0.08);
      padding: 1px 7px;
      border-radius: 99px;
    }

    .col-add-btn {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 600;
    }
    .col-add-btn:hover { background: rgba(15, 23, 42, 0.08); color: var(--text-primary); }

    .board-col-body {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .board-col-empty {
      padding: 20px 10px;
      text-align: center;
      font-size: 12px;
      color: var(--text-light);
      border: 1px dashed var(--border-strong);
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.55);
    }

    .board-col-footer {
      padding: 7px 10px;
      text-align: center;
      font-size: 11px;
      color: var(--text-light);
      border-top: 1px dashed var(--border);
    }

    /* Task Card */
    .task-card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-top: 3.5px solid var(--slate-500);
      border-radius: var(--radius-md);
      padding: 10px 11px;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: transform 0.12s, box-shadow 0.12s, border-color 0.12s, opacity 0.15s;
    }
    .task-card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
    .task-card.dragging { opacity: 0.4; }
    .task-card.completed { opacity: 0.58; }
    .task-card.completed .task-title { text-decoration: line-through; color: var(--text-muted); }

    .task-card.accent-overdue { border-top-color: var(--red-600); }
    .task-card.accent-tomorrow { border-top-color: var(--amber-500); }
    .task-card.accent-this_week { border-top-color: var(--blue-600); }
    .task-card.accent-later { border-top-color: var(--slate-500); }

    .task-top {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .task-check {
      width: 16px;
      height: 16px;
      margin-top: 1px;
      border-radius: 4px;
      border: 1.5px solid #94a3b8;
      background: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.12s;
    }
    .task-check:hover { border-color: var(--emerald-600); }
    .task-check.checked {
      background: var(--emerald-600);
      border-color: var(--emerald-600);
      color: #ffffff;
    }

    .task-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.35;
      flex: 1;
      word-break: break-word;
    }

    .task-meta-row {
      margin-top: 7px;
      margin-left: 24px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 5px;
    }

    .date-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 5px;
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
    }
    .date-chip.overdue {
      background: var(--red-50);
      border-color: #fecaca;
      color: var(--red-600);
    }
    .date-chip.today {
      background: var(--blue-50);
      border-color: #bfdbfe;
      color: var(--blue-600);
    }

    .project-link-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 5px;
      background: #eef2ff;
      color: #3730a3;
      border: 1px solid #c7d2fe;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      transition: background 0.12s;
    }
    .project-link-pill:hover { background: #e0e7ff; }

    .task-footer-row {
      margin-top: 8px;
      margin-left: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .type-badge {
      font-size: 10.5px;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 4px;
    }
    .type-call { background: var(--blue-50); color: var(--blue-600); }
    .type-meeting { background: var(--purple-50); color: var(--purple-600); }
    .type-email { background: var(--orange-50); color: var(--orange-600); }
    .type-followup { background: var(--emerald-50); color: var(--emerald-700); }

    /* Today Timeline (08:00 - 17:00) */
    .timeline-axis-note {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-light);
      padding-bottom: 5px;
      border-bottom: 1px solid #f1f5f9;
    }

    .time-block-row {
      display: flex;
      align-items: stretch;
      gap: 8px;
    }

    .time-gutter {
      width: 40px;
      flex-shrink: 0;
      text-align: right;
      padding-top: 8px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    .time-block-card {
      flex: 1;
      border-radius: var(--radius-md);
      padding: 9px 10px;
      color: #ffffff;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: transform 0.12s, box-shadow 0.12s, opacity 0.15s;
      min-width: 0;
    }
    .time-block-card:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
    .time-block-card.dragging { opacity: 0.4; }
    .time-block-card.completed { opacity: 0.58; }
    .time-block-card.completed .tb-title { text-decoration: line-through; }

    .time-block-card.tb-call { background: linear-gradient(135deg, #2563eb, #1d4ed8); }
    .time-block-card.tb-meeting { background: linear-gradient(135deg, #7c3aed, #6d28d9); }
    .time-block-card.tb-email { background: linear-gradient(135deg, #ea580c, #c2410c); }
    .time-block-card.tb-followup { background: linear-gradient(135deg, #16a34a, #15803d); }

    .tb-title {
      font-size: 12.5px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.3;
      flex: 1;
    }

    .tb-sub {
      margin-top: 5px;
      margin-left: 24px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.92);
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .tb-pill {
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 10.5px;
      font-weight: 600;
      cursor: pointer;
    }
    .tb-pill:hover { background: rgba(255, 255, 255, 0.32); }

    .drop-preview-slot {
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }

    .drop-preview-box {
      flex: 1;
      border: 2px dashed var(--blue-600);
      background: var(--blue-50);
      color: var(--blue-600);
      border-radius: var(--radius-md);
      padding: 9px 10px;
      font-size: 11.5px;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
    }

    .timeline-hours-ref {
      margin-top: 6px;
      margin-left: 48px;
      padding: 8px 10px;
      border-radius: var(--radius-md);
      border: 1px dashed var(--border-strong);
      background: var(--bg-subtle);
      color: var(--text-muted);
      font-size: 11px;
      display: flex;
      justify-content: space-between;
    }

    /* ==========================================================================
       SECTION 2: KALENDÁŘ (MONTHLY CALENDAR + DAY AGENDA)
       ========================================================================== */
    .calendar-layout {
      display: grid;
      grid-template-columns: 1fr 310px;
      gap: 16px;
      padding: 16px 20px 24px;
      height: 100%;
      min-height: 0;
    }

    .calendar-card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .calendar-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }

    .calendar-month-title {
      font-size: 16px;
      font-weight: 700;
      text-transform: capitalize;
    }

    .calendar-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      border-bottom: 1px solid var(--border);
      background: var(--bg-subtle);
    }

    .calendar-weekday {
      padding: 8px 10px;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-muted);
      text-align: center;
    }

    .calendar-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      grid-auto-rows: minmax(96px, 1fr);
      overflow-y: auto;
    }

    .cal-day {
      border-right: 1px solid #f1f5f9;
      border-bottom: 1px solid #f1f5f9;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      cursor: pointer;
      background: #ffffff;
      transition: background 0.12s;
      min-width: 0;
    }
    .cal-day:nth-child(7n) { border-right: none; }
    .cal-day:hover { background: #f8fafc; }
    .cal-day.other-month { background: #fafbfd; color: var(--text-light); }
    .cal-day.selected { background: #eff6ff; box-shadow: inset 0 0 0 2px var(--blue-600); }

    .cal-day-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .cal-day-num {
      width: 24px;
      height: 24px;
      border-radius: 99px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
    }

    .cal-day.is-today .cal-day-num {
      background: var(--blue-600);
      color: #ffffff;
      font-weight: 700;
    }

    .cal-day-add {
      width: 20px;
      height: 20px;
      border-radius: 5px;
      color: var(--text-light);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      opacity: 0;
      transition: opacity 0.12s, background 0.12s;
    }
    .cal-day:hover .cal-day-add { opacity: 1; }
    .cal-day-add:hover { background: var(--emerald-100); color: var(--emerald-700); }

    .cal-chip {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
    }
    .cal-chip.call { background: #dbeafe; color: #1d4ed8; }
    .cal-chip.meeting { background: #ede9fe; color: #6d28d9; }
    .cal-chip.email { background: #ffedd5; color: #c2410c; }
    .cal-chip.followup { background: #dcfce7; color: #15803d; }
    .cal-chip.project-close { background: #fef3c7; color: #92400e; border: 1px dashed #f59e0b; }
    .cal-chip.completed { opacity: 0.5; text-decoration: line-through; }

    .agenda-card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .agenda-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .agenda-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* ==========================================================================
       SECTION 3–6: TABLES, PIPELINE, CARDS, PROGNÓZA
       ========================================================================== */
    .page-pad { padding: 18px 20px 24px; }

    .card-surface {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }

    .pipeline-header-grid {
      display: grid;
      grid-template-columns: 1fr 330px;
      gap: 14px;
      margin-bottom: 14px;
    }

    .pipeline-box {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 14px 16px;
      box-shadow: var(--shadow-sm);
    }

    .stage-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 10px;
    }

    .stage-legend-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 6px;
      background: var(--bg-subtle);
      border: 1px solid transparent;
    }
    .stage-legend-btn.active { border-color: var(--navy-900); background: #eef2ff; }

    .pipeline-bar {
      display: flex;
      gap: 3px;
      height: 22px;
      background: var(--bg-canvas);
      border-radius: 6px;
      padding: 2px;
      overflow: hidden;
    }

    .pipeline-seg {
      height: 100%;
      border-radius: 4px;
      min-width: 6px;
      transition: opacity 0.15s;
      cursor: pointer;
    }

    .tick-bar {
      display: flex;
      gap: 2.5px;
      height: 14px;
      margin-top: 10px;
    }
    .tick { flex: 1; border-radius: 2px; background: #e2e8f0; }
    .tick.won { background: var(--emerald-600); }
    .tick.likely { background: #86efac; }

    .table-toolbar {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .tabs-bar { display: flex; gap: 6px; flex-wrap: wrap; }

    .tab-pill {
      padding: 5px 11px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      background: transparent;
    }
    .tab-pill:hover { background: var(--bg-hover); color: var(--text-primary); }
    .tab-pill.active { background: var(--navy-900); color: #ffffff; }

    .table-wrap { width: 100%; overflow-x: auto; }

    .crm-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      min-width: 820px;
    }

    .crm-table th {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-muted);
      background: var(--bg-subtle);
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    .crm-table td {
      padding: 11px 14px;
      border-bottom: 1px solid #f1f5f9;
      vertical-align: middle;
      white-space: nowrap;
    }

    .crm-table tbody tr { cursor: pointer; transition: background 0.1s; }
    .crm-table tbody tr:hover { background: #f8fafc; }

    .code-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 5px;
      background: #f1f5f9;
      color: #334155;
      border: 1px solid #e2e8f0;
    }
    .code-badge.qi { background: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; }
    .code-badge.pohoda { background: #f0fdf4; color: #15803d; border-color: #bbf7d0; }

    .stage-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 9px;
      border-radius: 99px;
      font-size: 11.5px;
      font-weight: 600;
    }

    .summary-footer {
      padding: 10px 16px;
      background: var(--bg-subtle);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 14px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .summary-footer strong { color: var(--text-primary); }

    /* Forecast KPIs & Charts */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 16px;
    }

    .kpi-card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 16px;
      box-shadow: var(--shadow-sm);
    }

    .kpi-label { font-size: 12px; font-weight: 600; color: var(--text-muted); }
    .kpi-val { font-size: 22px; font-weight: 700; margin-top: 6px; color: var(--text-primary); letter-spacing: -0.02em; }
    .kpi-sub { font-size: 11.5px; color: var(--text-muted); margin-top: 4px; }

    .charts-grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 16px;
    }

    .bar-row { margin-bottom: 12px; }
    .bar-top { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 5px; }
    .bar-track { height: 10px; background: var(--bg-canvas); border-radius: 99px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 99px; transition: width 0.3s ease; }

    /* ==========================================================================
       RIGHT DETAIL PANEL (DRAWER), MODALS, POPOVERS & TOAST
       ========================================================================== */
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.28);
      z-index: 60;
      display: none;
      justify-content: flex-end;
    }
    .drawer-overlay.open { display: flex; }

    .drawer {
      width: 100%;
      max-width: 470px;
      height: 100%;
      background: #ffffff;
      border-left: 1px solid var(--border);
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      animation: drawerSlide 0.16s ease-out;
    }

    @keyframes drawerSlide {
      from { transform: translateX(100%); }
      to { transform: translateX(0); }
    }

    .panel-header {
      padding: 15px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .panel-title { font-size: 15.5px; font-weight: 700; color: var(--text-primary); }
    .panel-sub { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }

    .panel-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .panel-footer {
      padding: 13px 18px;
      border-top: 1px solid var(--border);
      background: var(--bg-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.42);
      backdrop-filter: blur(2px);
      z-index: 70;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .overlay.open { display: flex; }

    .modal {
      background: #ffffff;
      border-radius: var(--radius-xl);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 540px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .form-field { display: flex; flex-direction: column; gap: 5px; }
    .form-label { font-size: 11.5px; font-weight: 600; color: var(--text-secondary); }

    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: #ffffff;
      font-size: 13px;
      outline: none;
      transition: border-color 0.12s, box-shadow 0.12s;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: var(--blue-600);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .form-section-box {
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .type-btn-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .type-pick-btn {
      padding: 8px 6px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      transition: all 0.12s;
    }
    .type-pick-btn:hover { background: var(--bg-subtle); }
    .type-pick-btn.active {
      border-color: var(--blue-600);
      background: var(--blue-50);
      color: var(--blue-600);
    }

    .linked-list-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background: #ffffff;
      font-size: 12px;
      cursor: pointer;
    }
    .linked-list-item:hover { background: var(--bg-subtle); }

    /* Popover */
    .popover {
      position: absolute;
      top: 40px;
      right: 0;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      padding: 12px;
      z-index: 80;
      display: none;
      width: 240px;
    }
    .popover.open { display: block; }

    /* Command Palette */
    .cmd-modal { max-width: 580px; align-self: flex-start; margin-top: 8vh; }
    .cmd-input-row { display: flex; align-items: center; gap: 10px; padding: 13px 16px; border-bottom: 1px solid var(--border); }
    .cmd-input { flex: 1; border: none; outline: none; font-size: 14px; }
    .cmd-results { max-height: 360px; overflow-y: auto; padding: 8px; }
    .cmd-group { font-size: 10.5px; font-weight: 700; text-transform: uppercase; color: var(--text-light); padding: 6px 10px 4px; }
    .cmd-item { width: 100%; text-align: left; padding: 8px 10px; border-radius: var(--radius-md); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .cmd-item:hover { background: var(--bg-hover); }

    /* Bottom Dark Undo Toast */
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #0f172a;
      color: #ffffff;
      padding: 10px 16px;
      border-radius: 10px;
      box-shadow: var(--shadow-lg);
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12.5px;
      font-weight: 500;
      z-index: 95;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s, transform 0.18s;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }

    .toast-undo {
      color: #4ade80;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.1);
    }
    .toast-undo:hover { background: rgba(255, 255, 255, 0.2); }

    /* Responsive */
    @media (max-width: 1100px) {
      .calendar-layout { grid-template-columns: 1fr; overflow-y: auto; }
      .pipeline-header-grid { grid-template-columns: 1fr; }
      .kpi-grid { grid-template-columns: repeat(2, 1fr); }
      .charts-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        top: 0; left: 0; bottom: 0;
        transform: translateX(-100%);
        box-shadow: var(--shadow-lg);
      }
      .sidebar.mobile-open { transform: translateX(0); }
      .mobile-menu-btn { display: inline-flex; }
      .search-trigger, .rate-btn { display: none; }
      .form-grid-2 { grid-template-columns: 1fr; }
      .kpi-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
