      // ========================================================================
      // SEKCE 6: PROGNÓZA & GRAFY
      // ========================================================================
      function renderForecastView() {
        const container = document.getElementById('viewContainer');
        const allP = state.projects;
        const totalPipeline = allP.reduce((s, p) => s + toActiveCurrency(p.value, p.nativeCurrency), 0);
        const wonVal = allP.filter(p => p.stage === 'won').reduce((s, p) => s + toActiveCurrency(p.value, p.nativeCurrency), 0);
        const weightedVal = allP.filter(p => p.stage !== 'won').reduce((s, p) => s + toActiveCurrency(p.value, p.nativeCurrency) * ((Number(p.probability) || 0) / 100), 0);
        const expected = wonVal + weightedVal;
        const target = Math.max(1, toActiveCurrency(state.settings.quarterTargetCZK, 'CZK'));
        const targetPct = Math.round((expected / target) * 100);

        const totalTasks = state.tasks.length;
        const doneTasks = state.tasks.filter(t => t.completed).length;
        const donePct = totalTasks > 0 ? Math.round((doneTasks / totalTasks) * 100) : 0;

        if (allP.length === 0 && totalTasks === 0) {
          container.innerHTML = `
            <div class="view-scroll">
              <div class="empty-state">
                <div class="empty-icon">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
                </div>
                <div class="empty-title">Prognóza čeká na první data</div>
                <div class="empty-desc">
                  Jakmile zadáte první projekty a úkoly, automaticky se zde vykreslí grafy hodnot podle fází, vážená pipeline v Kč/EUR i přehled plnění úkolů.
                </div>
                <button class="btn-emerald" id="emptyForecastBtn">+ Nový projekt</button>
              </div>
            </div>
          `;
          document.getElementById('emptyForecastBtn').addEventListener('click', () => openModal('new_project'));
          return;
        }

        const maxStage = Math.max(1, ...STAGES.map(st =>
          allP.filter(p => p.stage === st.id).reduce((s, p) => s + toActiveCurrency(p.value, p.nativeCurrency), 0)
        ));

        const stageBars = STAGES.map(st => {
          const sum = allP.filter(p => p.stage === st.id).reduce((s, p) => s + toActiveCurrency(p.value, p.nativeCurrency), 0);
          const cnt = allP.filter(p => p.stage === st.id).length;
          const pct = Math.round((sum / maxStage) * 100);
          return `
            <div class="bar-row">
              <div class="bar-top">
                <span style="display:flex; align-items:center; gap:6px; font-weight:600;">
                  <span class="col-dot" style="background:${st.color};"></span>${st.label} (${cnt})
                </span>
                <span class="tabular" style="font-weight:700;">${formatMoney(sum)}</span>
              </div>
              <div class="bar-track"><div class="bar-fill" style="width:${pct}%; background:${st.color};"></div></div>
            </div>
          `;
        }).join('');

        const r = 46;
        const circ = 2 * Math.PI * r;
        const offset = circ * (1 - donePct / 100);

        container.innerHTML = `
          <div class="view-scroll page-pad">
            <div class="kpi-grid tabular">
              <div class="kpi-card">
                <div class="kpi-label">Celková pipeline</div>
                <div class="kpi-val">${formatMoneyCompact(totalPipeline)}</div>
                <div class="kpi-sub">${allP.length} evidovaných projektů</div>
              </div>
              <div class="kpi-card">
                <div class="kpi-label">Vyhráno</div>
                <div class="kpi-val" style="color:var(--emerald-600);">${formatMoneyCompact(wonVal)}</div>
                <div class="kpi-sub">${allP.filter(p => p.stage === 'won').length} uzavřených projektů</div>
              </div>
              <div class="kpi-card">
                <div class="kpi-label">Vážená otevřená pipeline</div>
                <div class="kpi-val">${formatMoneyCompact(weightedVal)}</div>
                <div class="kpi-sub">Dle pravděpodobnosti výhry</div>
              </div>
              <div class="kpi-card">
                <div class="kpi-label">Plnění kvartálního cíle</div>
                <div class="kpi-val" style="color:${targetPct >= 100 ? 'var(--emerald-600)' : 'var(--blue-600)'};">${targetPct}\u00A0%</div>
                <div class="kpi-sub">Cíl: ${formatMoneyCompact(target)}</div>
              </div>
            </div>

            <div class="charts-grid">
              <div class="pipeline-box">
                <div style="font-size:14px; font-weight:700; margin-bottom:14px;">Hodnota projektů podle fází (${state.settings.currency})</div>
                ${stageBars}
              </div>

              <div class="pipeline-box" style="display:flex; flex-direction:column; justify-content:space-between;">
                <div style="font-size:14px; font-weight:700; margin-bottom:12px;">Plnění úkolů</div>
                <div style="display:flex; align-items:center; gap:24px; padding:10px 0;">
                  <svg width="116" height="116" viewBox="0 0 116 116">
                    <circle cx="58" cy="58" r="${r}" fill="none" stroke="#e2e8f0" stroke-width="11"/>
                    <circle cx="58" cy="58" r="${r}" fill="none" stroke="#16a34a" stroke-width="11"
                      stroke-dasharray="${circ.toFixed(1)}" stroke-dashoffset="${offset.toFixed(1)}"
                      transform="rotate(-90 58 58)" stroke-linecap="round"/>
                    <text x="58" y="63" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">${donePct}%</text>
                  </svg>
                  <div style="display:flex; flex-direction:column; gap:8px; font-size:13px;" class="tabular">
                    <div>Celkem úkolů: <strong>${totalTasks}</strong></div>
                    <div style="color:var(--emerald-700);">Splněno: <strong>${doneTasks}</strong></div>
                    <div style="color:var(--blue-600);">Otevřeno: <strong>${totalTasks - doneTasks}</strong></div>
                    <div style="color:var(--red-600);">Po termínu: <strong>${state.tasks.filter(t => !t.completed && getTaskColumn(t) === 'overdue').length}</strong></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      // ========================================================================
      // PRAVÝ DETAILNÍ PANEL (ÚKOL / PROJEKT / FIRMA / KONTAKT)
      // ========================================================================
      function openDrawer(type, id) {
        ui.drawerType = type;
        ui.drawerId = id;
        ui.drawerDeleteArmed = false;

        const titleEl = document.getElementById('drawerTitle');
        const subEl = document.getElementById('drawerSubtitle');
        const bodyEl = document.getElementById('drawerBody');
        const delBtn = document.getElementById('drawerDeleteBtn');

        if (type === 'task') {
          const t = state.tasks.find(x => x.id === id);
          if (!t) return;
          const proj = getProject(t.projectId);
          titleEl.textContent = 'Detail úkolu';
          subEl.textContent = t.createdAt ? `Založeno: ${formatDateCZ(t.createdAt)}` : 'Editace úkolu';
          delBtn.textContent = 'Smazat úkol';

          bodyEl.innerHTML = `
            <div class="form-field">
              <label class="form-label">Název úkolu</label>
              <input type="text" class="form-input" id="dtTitle" value="${escapeHtml(t.title)}" />
            </div>

            <label style="display:flex; align-items:center; gap:9px; padding:8px 10px; border-radius:8px; background:${t.completed ? 'var(--emerald-50)' : 'var(--bg-subtle)'}; border:1px solid ${t.completed ? '#bbf7d0' : 'var(--border)'}; cursor:pointer; font-weight:600;">
              <input type="checkbox" id="dtCompleted" ${t.completed ? 'checked' : ''} />
              <span>Stav: ${t.completed ? 'Splněno' : 'Probíhá'}</span>
            </label>

            <div class="form-grid-2">
              <div class="form-field">
                <label class="form-label">Přesné datum *</label>
                <input type="date" class="form-input tabular" id="dtDate" value="${escapeHtml(t.dueDate || getTodayStr())}" />
              </div>
              <div class="form-field">
                <label class="form-label">Čas začátku</label>
                <input type="time" class="form-input tabular" id="dtTime" value="${escapeHtml(t.startTime || '')}" />
              </div>
            </div>

            <div class="form-grid-2">
              <div class="form-field">
                <label class="form-label">Délka trvání</label>
                <select class="form-select" id="dtDuration">
                  ${[15, 30, 45, 60, 90].map(m => `<option value="${m}" ${Number(t.duration) === m ? 'selected' : ''}>${m} min</option>`).join('')}
                </select>
              </div>
              <div class="form-field">
                <label class="form-label">Vlastník / Autor</label>
                <input type="text" class="form-input" id="dtOwner" value="${escapeHtml(t.owner || state.settings.userName)}" />
              </div>
            </div>

            <div class="form-field">
              <label class="form-label">Typ úkolu</label>
              <input type="hidden" id="dtType" value="${escapeHtml(t.type || 'call')}" />
              <div class="type-btn-grid">
                ${Object.entries(TASK_TYPES).map(([k, v]) => `
                  <button type="button" class="type-pick-btn ${(t.type || 'call') === k ? 'active' : ''}" data-pick-ttype="${k}">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${v.icon}</svg>
                    <span>${v.label}</span>
                  </button>
                `).join('')}
              </div>
            </div>

            <div class="form-field">
              <label class="form-label">Vazba na projekt</label>
              <select class="form-select" id="dtProject">
                <option value="">— Bez vazby na projekt —</option>
                ${state.projects.map(p => `<option value="${p.id}" ${t.projectId === p.id ? 'selected' : ''}>${escapeHtml(formatProjectLabel(p))}</option>`).join('')}
              </select>
              ${proj ? `<button type="button" class="project-link-pill" id="dtOpenLinkedProject" style="margin-top:6px; align-self:flex-start;">📁 Otevřít projekt: ${escapeHtml(proj.name)} →</button>` : ''}
            </div>

            <div class="form-field">
              <label class="form-label">Poznámky</label>
              <textarea class="form-textarea" id="dtNotes" rows="4">${escapeHtml(t.notes || '')}</textarea>
            </div>
          `;

          bodyEl.querySelectorAll('[data-pick-ttype]').forEach(btn => {
            btn.addEventListener('click', () => {
              document.getElementById('dtType').value = btn.dataset.pickTtype;
              bodyEl.querySelectorAll('[data-pick-ttype]').forEach(b => b.classList.remove('active'));
              btn.classList.add('active');
            });
          });
          const jumpBtn = document.getElementById('dtOpenLinkedProject');
          if (jumpBtn) {
            jumpBtn.addEventListener('click', () => {
              ui.activeView = 'projects';
              renderAll();
              openDrawer('project', t.projectId);
            });
          }
        } else if (type === 'project') {
          const p = getProject(id);
          if (!p) return;
          const linkedTasks = state.tasks.filter(t => t.projectId === p.id).sort((a, b) => (a.dueDate || '').localeCompare(b.dueDate || ''));
          titleEl.textContent = p.name;
          subEl.textContent = 'Detail projektu';
          delBtn.textContent = 'Smazat projekt';

          bodyEl.innerHTML = `
            <div class="form-field">
              <label class="form-label">Název projektu *</label>
              <input type="text" class="form-input" id="dpName" value="${escapeHtml(p.name)}" />
            </div>

            <div class="form-section-box">
              <div style="font-size:11.5px; font-weight:700; color:var(--navy-900);">Identifikátory ERP / účetnictví</div>
              <div class="form-grid-2">
                <div class="form-field">
                  <label class="form-label">QI název</label>
                  <input type="text" class="form-input" id="dpQi" value="${escapeHtml(p.qiName || '')}" placeholder="Kód / název v QI" />
                </div>
                <div class="form-field">
                  <label class="form-label">Pohoda název</label>
                  <input type="text" class="form-input" id="dpPohoda" value="${escapeHtml(p.pohodaName || '')}" placeholder="Kód / název v Pohodě" />
                </div>
              </div>
            </div>

            <div class="form-field">
              <label class="form-label">Společnost</label>
              <select class="form-select" id="dpCompany">
                <option value="">— Vyberte společnost —</option>
                ${state.companies.map(c => `<option value="${c.id}" ${p.companyId === c.id ? 'selected' : ''}>${escapeHtml(c.name)}${c.ico ? ' (IČO: ' + escapeHtml(c.ico) + ')' : ''}</option>`).join('')}
              </select>
            </div>

            <div class="form-grid-2">
              <div class="form-field">
                <label class="form-label">Hodnota</label>
                <input type="number" class="form-input tabular" id="dpValue" value="${p.value || 0}" min="0" />
              </div>
              <div class="form-field">
                <label class="form-label">Měna</label>
                <select class="form-select" id="dpCurrency">
                  <option value="CZK" ${p.nativeCurrency === 'CZK' ? 'selected' : ''}>Kč (CZK)</option>
                  <option value="EUR" ${p.nativeCurrency === 'EUR' ? 'selected' : ''}>EUR (€)</option>
                </select>
              </div>
            </div>

            <div class="form-grid-2">
              <div class="form-field">
                <label class="form-label">Fáze</label>
                <select class="form-select" id="dpStage">
                  ${STAGES.map(s => `<option value="${s.id}" ${p.stage === s.id ? 'selected' : ''}>${s.label}</option>`).join('')}
                </select>
              </div>
              <div class="form-field">
                <label class="form-label">Pravděpodobnost výhry (%)</label>
                <input type="number" class="form-input tabular" id="dpProb" value="${p.probability || 0}" min="0" max="100" />
              </div>
            </div>

            <div class="form-grid-2">
              <div class="form-field">
                <label class="form-label">Termín uzavření</label>
                <input type="date" class="form-input tabular" id="dpCloseDate" value="${escapeHtml(p.targetCloseDate || '')}" />
              </div>
              <div class="form-field">
                <label class="form-label">Vlastník</label>
                <input type="text" class="form-input" id="dpOwner" value="${escapeHtml(p.owner || state.settings.userName)}" />
              </div>
            </div>

            <div class="form-field">
              <label class="form-label">Další krok</label>
              <input type="text" class="form-input" id="dpNextStep" value="${escapeHtml(p.nextStep || '')}" />
            </div>

            <div class="form-field">
              <label class="form-label">Poznámka</label>
              <textarea class="form-textarea" id="dpNotes" rows="3">${escapeHtml(p.notes || '')}</textarea>
            </div>

            <div class="form-section-box">
              <div style="display:flex; align-items:center; justify-content:space-between;">
                <span style="font-size:12px; font-weight:700;">Navázané úkoly (${linkedTasks.length})</span>
                <button type="button" class="btn-emerald" id="dpAddTaskBtn" style="height:26px; padding:0 9px; font-size:11.5px;">+ Přidat úkol k projektu</button>
              </div>
              ${linkedTasks.length ? linkedTasks.map(t => `
                <div class="linked-list-item" data-dp-open-task="${t.id}">
                  <div style="display:flex; align-items:center; gap:8px;">
                    <button type="button" class="task-check ${t.completed ? 'checked' : ''}" data-dp-toggle-task="${t.id}">
                      ${t.completed ? '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>' : ''}
                    </button>
                    <span style="font-weight:600; ${t.completed ? 'text-decoration:line-through; color:var(--text-muted);' : ''}">${escapeHtml(t.title)}</span>
                  </div>
                  <span class="date-chip">📅 ${formatDateCZ(t.dueDate)}</span>
                </div>
              `).join('') : '<div style="font-size:12px; color:var(--text-muted);">K tomuto projektu zatím nejsou přiřazeny žádné úkoly.</div>'}
            </div>
          `;

          document.getElementById('dpAddTaskBtn').addEventListener('click', () => {
            closeDrawer();
            openModal('new_task', { projectId: p.id, dueDate: getTodayStr() });
          });
          bodyEl.querySelectorAll('[data-dp-toggle-task]').forEach(b => {
            b.addEventListener('click', (e) => {
              e.stopPropagation();
              const t = state.tasks.find(x => x.id === b.dataset.dpToggleTask);
              if (t) {
                t.completed = !t.completed;
                saveState();
                openDrawer('project', p.id);
                renderAll();
              }
            });
          });
          bodyEl.querySelectorAll('[data-dp-open-task]').forEach(el => {
            el.addEventListener('click', () => openDrawer('task', el.dataset.dpOpenTask));
          });
        } else if (type === 'company') {
          const c = getCompany(id);
          if (!c) return;
          const cContacts = state.contacts.filter(x => x.companyId === c.id);
          const cProjects = state.projects.filter(p => p.companyId === c.id);
          titleEl.textContent = c.name;
          subEl.textContent = 'Detail společnosti';
          delBtn.textContent = 'Smazat firmu';

          bodyEl.innerHTML = `
            <div class="form-field">
              <label class="form-label">Název společnosti *</label>
              <input type="text" class="form-input" id="dcName" value="${escapeHtml(c.name)}" />
            </div>
            <div class="form-grid-2">
              <div class="form-field">
                <label class="form-label">IČO</label>
                <input type="text" class="form-input tabular" id="dcIco" value="${escapeHtml(c.ico || '')}" />
              </div>
              <div class="form-field">
                <label class="form-label">DIČ (DIČO)</label>
                <input type="text" class="form-input tabular" id="dcDic" value="${escapeHtml(c.dic || '')}" />
              </div>
            </div>
            <div class="form-field">
              <label class="form-label">Poznámka</label>
              <textarea class="form-textarea" id="dcNotes" rows="3">${escapeHtml(c.notes || '')}</textarea>
            </div>
            <div class="form-section-box">
              <div style="font-size:12px; font-weight:700;">Kontakty (${cContacts.length})</div>
              ${cContacts.length ? cContacts.map(ct => `
                <div class="linked-list-item" data-dc-contact="${ct.id}">
                  <span><strong>${escapeHtml(ct.name)}</strong> · ${escapeHtml(ct.role || '')}</span>
                  <span style="color:var(--text-muted);">${escapeHtml(ct.phone || ct.email || '')}</span>
                </div>
              `).join('') : '<div style="font-size:12px; color:var(--text-muted);">Žádné kontakty</div>'}
            </div>
            <div class="form-section-box">
              <div style="font-size:12px; font-weight:700;">Projekty (${cProjects.length})</div>
              ${cProjects.length ? cProjects.map(pr => `
                <div class="linked-list-item" data-dc-project="${pr.id}">
                  <span style="font-weight:600;">${escapeHtml(pr.name)}</span>
                  <span class="tabular" style="font-weight:700;">${formatMoney(toActiveCurrency(pr.value, pr.nativeCurrency))}</span>
                </div>
              `).join('') : '<div style="font-size:12px; color:var(--text-muted);">Žádné projekty</div>'}
            </div>
          `;

          bodyEl.querySelectorAll('[data-dc-contact]').forEach(el => el.addEventListener('click', () => openDrawer('contact', el.dataset.dcContact)));
          bodyEl.querySelectorAll('[data-dc-project]').forEach(el => el.addEventListener('click', () => openDrawer('project', el.dataset.dcProject)));
        } else if (type === 'contact') {
          const ct = state.contacts.find(x => x.id === id);
          if (!ct) return;
          titleEl.textContent = ct.name;
          subEl.textContent = 'Detail kontaktu';
          delBtn.textContent = 'Smazat kontakt';

          bodyEl.innerHTML = `
            <div class="form-field">
              <label class="form-label">Jméno a příjmení *</label>
              <input type="text" class="form-input" id="dkName" value="${escapeHtml(ct.name)}" />
            </div>
            <div class="form-field">
              <label class="form-label">Společnost</label>
              <select class="form-select" id="dkCompany">
                <option value="">— Bez společnosti —</option>
                ${state.companies.map(c => `<option value="${c.id}" ${ct.companyId === c.id ? 'selected' : ''}>${escapeHtml(c.name)}${c.ico ? ' (IČO: ' + escapeHtml(c.ico) + ')' : ''}</option>`).join('')}
              </select>
            </div>
            <div class="form-field">
              <label class="form-label">Pozice</label>
              <input type="text" class="form-input" id="dkRole" value="${escapeHtml(ct.role || '')}" />
            </div>
            <div class="form-grid-2">
              <div class="form-field">
                <label class="form-label">E-mail</label>
                <input type="email" class="form-input" id="dkEmail" value="${escapeHtml(ct.email || '')}" />
              </div>
              <div class="form-field">
                <label class="form-label">Telefon</label>
                <input type="text" class="form-input" id="dkPhone" value="${escapeHtml(ct.phone || '')}" />
              </div>
            </div>
            <div class="form-field">
              <label class="form-label">Poznámka</label>
              <textarea class="form-textarea" id="dkNotes" rows="3">${escapeHtml(ct.notes || '')}</textarea>
            </div>
          `;
        }

        document.getElementById('drawerOverlay').classList.add('open');
      }

      function closeDrawer() {
        document.getElementById('drawerOverlay').classList.remove('open');
        ui.drawerType = null;
        ui.drawerId = null;
        ui.drawerDeleteArmed = false;
      }

      document.getElementById('drawerCloseBtn').addEventListener('click', closeDrawer);
      document.getElementById('drawerCancelBtn').addEventListener('click', closeDrawer);
      document.getElementById('drawerOverlay').addEventListener('click', (e) => {
        if (e.target.id === 'drawerOverlay') closeDrawer();
      });

      document.getElementById('drawerSaveBtn').addEventListener('click', () => {
        if (ui.drawerType === 'task') {
          const t = state.tasks.find(x => x.id === ui.drawerId);
          if (!t) return;
          t.title = document.getElementById('dtTitle').value.trim() || t.title;
          t.completed = document.getElementById('dtCompleted').checked;
          t.dueDate = document.getElementById('dtDate').value || getTodayStr();
          t.startTime = document.getElementById('dtTime').value || '';
          t.duration = Number(document.getElementById('dtDuration').value) || 30;
          t.owner = document.getElementById('dtOwner').value.trim() || state.settings.userName;
          t.type = document.getElementById('dtType').value || 'call';
          t.projectId = document.getElementById('dtProject').value || null;
          t.notes = document.getElementById('dtNotes').value;
          saveState();
          closeDrawer();
          renderAll();
          showToast(`Úkol „${t.title}“ uložen`);
        } else if (ui.drawerType === 'project') {
          const p = getProject(ui.drawerId);
          if (!p) return;
          p.name = document.getElementById('dpName').value.trim() || p.name;
          p.qiName = document.getElementById('dpQi').value.trim();
          p.pohodaName = document.getElementById('dpPohoda').value.trim();
          p.companyId = document.getElementById('dpCompany').value || null;
          p.value = Number(document.getElementById('dpValue').value) || 0;
          p.nativeCurrency = document.getElementById('dpCurrency').value;
          p.stage = document.getElementById('dpStage').value;
          p.probability = Math.max(0, Math.min(100, Number(document.getElementById('dpProb').value) || 0));
          p.targetCloseDate = document.getElementById('dpCloseDate').value || '';
          p.owner = document.getElementById('dpOwner').value.trim() || state.settings.userName;
          p.nextStep = document.getElementById('dpNextStep').value.trim();
          p.notes = document.getElementById('dpNotes').value;
          saveState();
          closeDrawer();
          renderAll();
          showToast(`Projekt „${p.name}“ uložen`);
        } else if (ui.drawerType === 'company') {
          const c = getCompany(ui.drawerId);
          if (!c) return;
          c.name = document.getElementById('dcName').value.trim() || c.name;
          c.ico = document.getElementById('dcIco').value.trim();
          c.dic = document.getElementById('dcDic').value.trim();
          c.notes = document.getElementById('dcNotes').value;
          saveState();
          closeDrawer();
          renderAll();
          showToast(`Společnost „${c.name}“ uložena`);
        } else if (ui.drawerType === 'contact') {
          const ct = state.contacts.find(x => x.id === ui.drawerId);
          if (!ct) return;
          ct.name = document.getElementById('dkName').value.trim() || ct.name;
          ct.companyId = document.getElementById('dkCompany').value || null;
          ct.role = document.getElementById('dkRole').value.trim();
          ct.email = document.getElementById('dkEmail').value.trim();
          ct.phone = document.getElementById('dkPhone').value.trim();
          ct.notes = document.getElementById('dkNotes').value;
          saveState();
          closeDrawer();
          renderAll();
          showToast(`Kontakt „${ct.name}“ uložen`);
        }
      });

      document.getElementById('drawerDeleteBtn').addEventListener('click', () => {
        const btn = document.getElementById('drawerDeleteBtn');
        if (!ui.drawerDeleteArmed) {
          ui.drawerDeleteArmed = true;
          btn.textContent = 'Klikněte znovu pro smazání';
          return;
        }
        if (ui.drawerType === 'task') {
          const t = state.tasks.find(x => x.id === ui.drawerId);
          ui.undoTasksSnapshot = JSON.stringify(state.tasks);
          state.tasks = state.tasks.filter(x => x.id !== ui.drawerId);
          saveState();
          closeDrawer();
          renderAll();
          showToast(`Úkol „${t ? t.title : ''}“ smazán`, true);
        } else if (ui.drawerType === 'project') {
          const p = getProject(ui.drawerId);
          state.projects = state.projects.filter(x => x.id !== ui.drawerId);
          state.tasks.forEach(t => { if (t.projectId === ui.drawerId) t.projectId = null; });
          saveState();
          closeDrawer();
          renderAll();
          showToast(`Projekt „${p ? p.name : ''}“ smazán`);
        } else if (ui.drawerType === 'company') {
          const c = getCompany(ui.drawerId);
          state.companies = state.companies.filter(x => x.id !== ui.drawerId);
          state.contacts.forEach(ct => { if (ct.companyId === ui.drawerId) ct.companyId = null; });
          state.projects.forEach(pr => { if (pr.companyId === ui.drawerId) pr.companyId = null; });
          saveState();
          closeDrawer();
          renderAll();
          showToast(`Společnost „${c ? c.name : ''}“ smazána`);
        } else if (ui.drawerType === 'contact') {
          const ct = state.contacts.find(x => x.id === ui.drawerId);
          state.contacts = state.contacts.filter(x => x.id !== ui.drawerId);
          saveState();
          closeDrawer();
          renderAll();
          showToast(`Kontakt „${ct ? ct.name : ''}“ smazán`);
        }
      });

      // ========================================================================
      // MODÁLNÍ OKNA (NOVÝ ÚKOL / PROJEKT / FIRMA / KONTAKT / PROFIL)
      // ========================================================================
      function openModal(mode, prefill = {}) {
        ui.modalMode = mode;
        ui.modalPrefill = prefill;
        const titleEl = document.getElementById('modalTitle');
        const bodyEl = document.getElementById('modalBody');
        const footerEl = document.getElementById('modalFooter');
        const submitBtn = document.getElementById('modalSubmitBtn');
        footerEl.style.display = 'flex';

        if (mode === 'new_task') {
          titleEl.textContent = 'Nový úkol';
          submitBtn.textContent = 'Vytvořit úkol';
          const defDate = prefill.dueDate || getTodayStr();
          const defProj = prefill.projectId || '';
          bodyEl.innerHTML = `
            <div class="form-field">
              <label class="form-label">Název úkolu *</label>
              <input type="text" class="form-input" id="mtTitle" required placeholder="např. Telefonát ohledně cenové nabídky" />
            </div>
            <div class="form-grid-2">
              <div class="form-field">
                <label class="form-label">Přesné datum *</label>
                <input type="date" class="form-input tabular" id="mtDate" required value="${escapeHtml(defDate)}" />
              </div>
              <div class="form-field">
                <label class="form-label">Čas začátku (volitelné)</label>
                <input type="time" class="form-input tabular" id="mtTime" />
              </div>
            </div>

      function closeModal() {
        document.getElementById('modalOverlay').classList.remove('open');
        ui.modalMode = null;
      }

      document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
      document.getElementById('modalCancelBtn').addEventListener('click', closeModal);
      document.getElementById('modalOverlay').addEventListener('click', (e) => {
        if (e.target.id === 'modalOverlay') closeModal();
      });

      document.getElementById('modalForm').addEventListener('submit', (e) => {
        e.preventDefault();
        if (ui.modalMode === 'new_task') {
          const title = document.getElementById('mtTitle').value.trim();
          if (!title) return;
          const dueDate = document.getElementById('mtDate').value || getTodayStr();
          const newTask = {
            id: 't_' + Date.now(),
            title,
            dueDate,
            startTime: document.getElementById('mtTime').value || '',
            duration: Number(document.getElementById('mtDuration').value) || 30,
            type: document.getElementById('mtType').value || 'call',
            projectId: document.getElementById('mtProject').value || null,
            owner: document.getElementById('mtOwner').value.trim() || state.settings.userName,
            notes: document.getElementById('mtNotes').value.trim(),
            completed: false,
            order: state.tasks.length,
            createdAt: getTodayStr()
          };
          state.tasks.push(newTask);
          saveState();
          closeModal();
          renderAll();
          showToast(`Úkol „${title}“ vytvořen (${formatDateCZ(dueDate)})`);
        } else if (ui.modalMode === 'new_project') {
          const name = document.getElementById('mpName').value.trim();
          if (!name) return;
          state.projects.unshift({
            id: 'p_' + Date.now(),
            name,
            qiName: document.getElementById('mpQi').value.trim(),
            pohodaName: document.getElementById('mpPohoda').value.trim(),
            companyId: document.getElementById('mpCompany').value || null,
            value: Number(document.getElementById('mpValue').value) || 0,
            nativeCurrency: document.getElementById('mpCurrency').value,
            stage: document.getElementById('mpStage').value,
            probability: Math.max(0, Math.min(100, Number(document.getElementById('mpProb').value) || 0)),
            targetCloseDate: document.getElementById('mpCloseDate').value || '',
            owner: document.getElementById('mpOwner').value.trim() || state.settings.userName,
            nextStep: document.getElementById('mpNextStep').value.trim(),
            notes: document.getElementById('mpNotes').value.trim()
          });
          saveState();
          closeModal();
          renderAll();
          showToast(`Projekt „${name}“ vytvořen`);
        } else if (ui.modalMode === 'new_company') {
          const name = document.getElementById('mcName').value.trim();
          if (!name) return;
          state.companies.unshift({
            id: 'co_' + Date.now(),
            name,
            ico: document.getElementById('mcIco').value.trim(),
            dic: document.getElementById('mcDic').value.trim(),
            notes: document.getElementById('mcNotes').value.trim()
          });
          saveState();
          closeModal();
          renderAll();
          showToast(`Společnost „${name}“ přidána`);
        } else if (ui.modalMode === 'new_contact') {
          const name = document.getElementById('mkName').value.trim();
          if (!name) return;
          const compMode = document.querySelector('input[name="mkCompMode"]:checked')?.value || 'new';
          let companyId = null;

          if (compMode === 'existing') {
            companyId = document.getElementById('mkExistingComp').value || null;
          } else {
            const newCompName = document.getElementById('mkNewCompName').value.trim();
            if (newCompName) {
              const newCompany = {
                id: 'co_' + Date.now() + '_a',
                name: newCompName,
                ico: document.getElementById('mkNewCompIco').value.trim(),
                dic: document.getElementById('mkNewCompDic').value.trim(),
                notes: ''
              };
              state.companies.unshift(newCompany);
              companyId = newCompany.id;
            }
          }

          state.contacts.unshift({
            id: 'ct_' + Date.now(),
            name,
            companyId,
            role: document.getElementById('mkRole').value.trim(),
            email: document.getElementById('mkEmail').value.trim(),
            phone: document.getElementById('mkPhone').value.trim(),
            notes: document.getElementById('mkNotes').value.trim()
          });
          saveState();
          closeModal();
          renderAll();
          showToast(companyId && compMode === 'new' ? `Kontakt „${name}“ i nová firma byly uloženy` : `Kontakt „${name}“ uložen`);
        } else if (ui.modalMode === 'profile') {
          state.settings.userName = document.getElementById('profUserName').value.trim() || 'Správce (Autor)';
          state.settings.quarterTargetCZK = Math.max(1000, Number(document.getElementById('profTarget').value) || 5000000);
          saveState();
          closeModal();
          renderAll();
          showToast('Nastavení profilu uloženo');
        }
      });

      function openCmd() {
        document.getElementById('cmdOverlay').classList.add('open');
        const inp = document.getElementById('cmdInput');
        inp.value = '';
        renderCmdResults('');
        setTimeout(() => inp.focus(), 20);
      }

      function closeCmd() {
        document.getElementById('cmdOverlay').classList.remove('open');
      }

      function renderCmdResults(query) {
        const q = query.trim().toLowerCase();
        const res = document.getElementById('cmdResults');
        let html = '';

        const actions = [
          { id: 'new_task', label: '+ Vytvořit nový úkol' },
          { id: 'new_project', label: '+ Vytvořit nový projekt' },
          { id: 'new_contact', label: '+ Vytvořit nový kontakt (+ firma)' },
          { id: 'new_company', label: '+ Vytvořit novou společnost' }
        ].filter(a => !q || a.label.toLowerCase().includes(q));

        if (actions.length) {
          html += `<div class="cmd-group">Rychlé akce</div>`;
          html += actions.map(a => `<button class="cmd-item" data-cmd-act="${a.id}"><strong>${a.label}</strong><span style="font-size:11px; color:var(--text-light);">Akce</span></button>`).join('');
        }

        const projs = state.projects.filter(p =>
          !q ||
          (p.name || '').toLowerCase().includes(q) ||
          (p.qiName || '').toLowerCase().includes(q) ||
          (p.pohodaName || '').toLowerCase().includes(q)
        ).slice(0, 6);
        if (projs.length) {
          html += `<div class="cmd-group">Projekty</div>`;
          html += projs.map(p => `<button class="cmd-item" data-cmd-open="project:${p.id}"><span><strong>${escapeHtml(p.name)}</strong> ${p.qiName ? `<span class="code-badge qi">${escapeHtml(p.qiName)}</span>` : ''} ${p.pohodaName ? `<span class="code-badge pohoda">${escapeHtml(p.pohodaName)}</span>` : ''}</span><span class="tabular" style="font-size:11.5px; color:var(--text-muted);">${formatMoney(toActiveCurrency(p.value, p.nativeCurrency))}</span></button>`).join('');
        }

        const tasks = state.tasks.filter(t => !q || (t.title || '').toLowerCase().includes(q)).slice(0, 6);
        if (tasks.length) {
          html += `<div class="cmd-group">Úkoly</div>`;
          html += tasks.map(t => `<button class="cmd-item" data-cmd-open="task:${t.id}"><span>${escapeHtml(t.title)}</span><span class="date-chip">📅 ${formatDateCZ(t.dueDate)}</span></button>`).join('');
        }

        const comps = state.companies.filter(c =>
          !q ||
          (c.name || '').toLowerCase().includes(q) ||
          (c.ico || '').toLowerCase().includes(q) ||
          (c.dic || '').toLowerCase().includes(q)
        ).slice(0, 5);
        if (comps.length) {
          html += `<div class="cmd-group">Firmy</div>`;
          html += comps.map(c => `<button class="cmd-item" data-cmd-open="company:${c.id}"><span><strong>${escapeHtml(c.name)}</strong></span><span class="tabular" style="font-size:11.5px; color:var(--text-muted);">${c.ico ? 'IČO: ' + escapeHtml(c.ico) : ''}</span></button>`).join('');
        }

        const cts = state.contacts.filter(c => !q || (c.name || '').toLowerCase().includes(q) || (c.email || '').toLowerCase().includes(q)).slice(0, 5);
        if (cts.length) {
          html += `<div class="cmd-group">Kontakty</div>`;
          html += cts.map(c => `<button class="cmd-item" data-cmd-open="contact:${c.id}"><span><strong>${escapeHtml(c.name)}</strong> · ${escapeHtml(c.role || '')}</span><span style="font-size:11.5px; color:var(--text-muted);">${escapeHtml(c.email || '')}</span></button>`).join('');
        }

        res.innerHTML = html || `<div style="padding:24px; text-align:center; color:var(--text-muted);">Nic nenalezeno pro „${escapeHtml(query)}“.</div>`;

        res.querySelectorAll('[data-cmd-act]').forEach(b => {
          b.addEventListener('click', () => { closeCmd(); openModal(b.dataset.cmdAct); });
        });
        res.querySelectorAll('[data-cmd-open]').forEach(b => {
          b.addEventListener('click', () => {
            const [type, id] = b.dataset.cmdOpen.split(':');
            closeCmd();
            openDrawer(type, id);
          });
        });
      }

      document.getElementById('searchTriggerBtn').addEventListener('click', openCmd);
      document.getElementById('cmdInput').addEventListener('input', (e) => renderCmdResults(e.target.value));
      document.getElementById('cmdOverlay').addEventListener('click', (e) => {
        if (e.target.id === 'cmdOverlay') closeCmd();
      });

      document.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
          e.preventDefault();
          openCmd();
        } else if (e.key === 'Escape') {
          closeCmd();
          closeModal();
          closeDrawer();
          document.getElementById('ratePopover').classList.remove('open');
        }
      });

      // ========================================================================
      // EXPORT CSV, IMPORT JSON, MĚNA & OVLÁDÁNÍ
      // ========================================================================
      function downloadFile(content, filename, mime) {
        const blob = new Blob([content], { type: mime });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      }

      function exportProjectsCSV(list) {
        const headers = ['Název projektu', 'QI název', 'Pohoda název', 'Společnost', 'IČO', 'Fáze', `Hodnota (${state.settings.currency})`, 'Pravděpodobnost %', 'Termín uzavření', 'Vlastník'];
        const rows = list.map(p => {
          const comp = getCompany(p.companyId);
          return [
            `"${(p.name || '').replace(/"/g, '""')}"`,
            `"${(p.qiName || '').replace(/"/g, '""')}"`,
            `"${(p.pohodaName || '').replace(/"/g, '""')}"`,
            `"${comp ? comp.name.replace(/"/g, '""') : ''}"`,
            `"${comp ? (comp.ico || '') : ''}"`,
            `"${getStage(p.stage).label}"`,
            Math.round(toActiveCurrency(p.value, p.nativeCurrency)),
            p.probability || 0,
            p.targetCloseDate || '',
            `"${(p.owner || '').replace(/"/g, '""')}"`
          ];
        });
        const csv = '\uFEFF' + [headers.join(';'), ...rows.map(r => r.join(';'))].join('\n');
        downloadFile(csv, `outpost-projekty-${getTodayStr()}.csv`, 'text/csv;charset=utf-8;');
        showToast(`Exportováno ${list.length} projektů do CSV`);
      }

      document.getElementById('jsonImportInput').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const parsed = JSON.parse(reader.result);
            if (parsed && Array.isArray(parsed.projects) && Array.isArray(parsed.tasks) && Array.isArray(parsed.companies) && Array.isArray(parsed.contacts)) {
              state = parsed;
              saveState();
              closeModal();
              renderAll();
              showToast('Záloha dat byla úspěšně načtena');
            } else {
              showToast('Neplatný formát souboru zálohy');
            }
          } catch (err) {
            showToast('Chyba při čtení JSON souboru');
          }
        };
        reader.readAsText(file);
        e.target.value = '';
      });

      document.getElementById('currCzkBtn').addEventListener('click', () => {
        state.settings.currency = 'CZK';
        saveState();
        renderAll();
      });
      document.getElementById('currEurBtn').addEventListener('click', () => {
        state.settings.currency = 'EUR';
        saveState();
        renderAll();
      });

      document.getElementById('rateBtn').addEventListener('click', (e) => {
        e.stopPropagation();
        document.getElementById('rateInput').value = state.settings.exchangeRate;
        document.getElementById('ratePopover').classList.toggle('open');
      });
      document.getElementById('rateCancelBtn').addEventListener('click', () => {
        document.getElementById('ratePopover').classList.remove('open');
      });
      document.getElementById('rateSaveBtn').addEventListener('click', () => {
        const val = parseFloat(document.getElementById('rateInput').value);
        if (val > 0) {
          state.settings.exchangeRate = val;
          saveState();
          document.getElementById('ratePopover').classList.remove('open');
          renderAll();
          showToast(`Kurz uložen: ${val.toFixed(2).replace('.', ',')} Kč/€`);
        }
      });

      document.getElementById('topbarPrimaryCta').addEventListener('click', (e) => {
        openModal(e.currentTarget.dataset.modal || 'new_task');
      });

      document.getElementById('openProfileModalBtn').addEventListener('click', () => openModal('profile'));

      document.getElementById('mobileMenuBtn').addEventListener('click', (e) => {
        e.stopPropagation();
        document.getElementById('sidebar').classList.toggle('mobile-open');
      });

      document.addEventListener('click', (e) => {
        if (!e.target.closest('#ratePopover') && !e.target.closest('#rateBtn')) {
          document.getElementById('ratePopover').classList.remove('open');
        }
        if (!e.target.closest('#sidebar') && !e.target.closest('#mobileMenuBtn')) {
          document.getElementById('sidebar').classList.remove('mobile-open');
        }
      });

      // ========================================================================
      // HLAVNÍ RENDER
      // ========================================================================
      function renderAll() {
        renderSidebar();
        renderTopbar();
        switch (ui.activeView) {
          case 'tasks':     renderTasksView(); break;
          case 'calendar':  renderCalendarView(); break;
          case 'projects':  renderProjectsView(); break;
          case 'companies': renderCompaniesView(); break;
          case 'contacts':  renderContactsView(); break;
          case 'forecast':  renderForecastView(); break;
          default:          renderTasksView();
        }
      }

      renderAll();
    })();
  </script>
</body>
</html>
