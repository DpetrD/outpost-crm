  <script>
    /* ==========================================================================
       OUTPOST CRM v2 — CLEAN EMPTY DATABASE & FULL LOGIC
       ========================================================================== */
    (function () {
      'use strict';

      const STORAGE_KEY = 'outpost_crm_v2_clean';

      const STAGES = [
        { id: 'lead',        label: 'Lead',        color: '#64748b', bg: '#f1f5f9', fg: '#334155' },
        { id: 'qualified',   label: 'Kvalifikace', color: '#2563eb', bg: '#eff6ff', fg: '#1d4ed8' },
        { id: 'demo',        label: 'Prezentace',  color: '#7c3aed', bg: '#f5f3ff', fg: '#6d28d9' },
        { id: 'proposal',    label: 'Nabídka',     color: '#f59e0b', bg: '#fffbeb', fg: '#b45309' },
        { id: 'negotiation', label: 'Vyjednávání', color: '#ea580c', bg: '#fff7ed', fg: '#c2410c' },
        { id: 'won',         label: 'Vyhráno',     color: '#16a34a', bg: '#f0fdf4', fg: '#15803d' }
      ];

      const TASK_COLUMNS = [
        { id: 'overdue',   label: 'Po termínu',  dot: '#dc2626' },
        { id: 'today',     label: 'Dnes',        dot: '#2563eb' },
        { id: 'tomorrow',  label: 'Zítra',       dot: '#f59e0b' },
        { id: 'this_week', label: 'Tento týden', dot: '#3b82f6' },
        { id: 'later',     label: 'Později',     dot: '#64748b' }
      ];

      const TASK_TYPES = {
        call:     { label: 'Hovor',     badge: 'type-call',     tb: 'tb-call',     chip: 'call',     icon: '<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>' },
        meeting:  { label: 'Schůzka',   badge: 'type-meeting',  tb: 'tb-meeting',  chip: 'meeting',  icon: '<rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>' },
        email:    { label: 'E-mail',    badge: 'type-email',    tb: 'tb-email',    chip: 'email',    icon: '<path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>' },
        followup: { label: 'Follow-up', badge: 'type-followup', tb: 'tb-followup', chip: 'followup', icon: '<polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>' }
      };

      const CZ_MONTHS = ['leden', 'únor', 'březen', 'duben', 'květen', 'červen', 'červenec', 'srpen', 'září', 'říjen', 'listopad', 'prosinec'];

      // ========================================================================
      // 100% PRÁZDNÝ VÝCHOZÍ STAV (ZERO DEMO DATA)
      // ========================================================================
      function createEmptyState() {
        return {
          settings: {
            userName: 'Správce (Autor)',
            currency: 'CZK',
            exchangeRate: 25.20,
            quarterTargetCZK: 5000000
          },
          companies: [],
          contacts: [],
          projects: [],
          tasks: []
        };
      }

      let state = loadState();

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && Array.isArray(parsed.projects) && Array.isArray(parsed.tasks) && Array.isArray(parsed.companies) && Array.isArray(parsed.contacts)) {
              return parsed;
            }
          }
        } catch (err) {
          console.warn('Chyba načítání localStorage:', err);
        }
        const empty = createEmptyState();
        saveState(empty);
        return empty;
      }

      function saveState(next = state) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(next));
        } catch (err) {
          console.warn('Chyba ukládání do localStorage:', err);
        }
      }

      // ========================================================================
      // UI STAV
      // ========================================================================
      const nowDate = new Date();
      const ui = {
        activeView: 'tasks',         // tasks | calendar | projects | companies | contacts | forecast
        tasksViewMode: 'board',      // board | list
        tasksFilter: 'all',          // all | mine | overdue | today
        projectsStageFilter: 'all',
        projectsTab: 'all',          // all | open | won

        calYear: nowDate.getFullYear(),
        calMonth: nowDate.getMonth(),
        calSelectedDate: getTodayStr(),
        calShowProjectClose: true,

        companySearch: '',
        contactSearch: '',

        drawerType: null,            // task | project | company | contact
        drawerId: null,
        drawerDeleteArmed: false,

        modalMode: null,             // new_task | new_project | new_company | new_contact | profile
        modalPrefill: {},

        undoTasksSnapshot: null,
        toastTimer: null,

        dragTaskId: null,
        dragSourceCol: null,
        dropInsertIndex: null
      };

      // ========================================================================
      // DATUMY, MĚNY A POMOCNÉ FUNKCE
      // ========================================================================
      function toYMD(dateObj) {
        const y = dateObj.getFullYear();
        const m = String(dateObj.getMonth() + 1).padStart(2, '0');
        const d = String(dateObj.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
      }

      function getTodayStr() {
        return toYMD(new Date());
      }

      function addDaysYMD(baseYMD, deltaDays) {
        const [y, m, d] = baseYMD.split('-').map(Number);
        const dt = new Date(y, m - 1, d + deltaDays);
        return toYMD(dt);
      }

      function formatDateCZ(ymd) {
        if (!ymd || !/^\d{4}-\d{2}-\d{2}$/.test(ymd)) return 'Bez data';
        const [y, m, d] = ymd.split('-');
        return `${Number(d)}. ${Number(m)}. ${y}`;
      }

      function diffDaysFromToday(ymd) {
        if (!ymd) return 999;
        const [y1, m1, d1] = getTodayStr().split('-').map(Number);
        const [y2, m2, d2] = ymd.split('-').map(Number);
        const t1 = Date.UTC(y1, m1 - 1, d1);
        const t2 = Date.UTC(y2, m2 - 1, d2);
        return Math.round((t2 - t1) / 86400000);
      }

      function getTaskColumn(task) {
        const diff = diffDaysFromToday(task.dueDate);
        if (diff < 0) return 'overdue';
        if (diff === 0) return 'today';
        if (diff === 1) return 'tomorrow';
        if (diff <= 7) return 'this_week';
        return 'later';
      }

      function timeStrToMins(str) {
        if (!str || !str.includes(':')) return null;
        const [h, m] = str.split(':').map(Number);
        if (Number.isNaN(h) || Number.isNaN(m)) return null;
        return h * 60 + m;
      }

      function minsToTimeStr(mins) {
        const clamped = Math.max(0, Math.min(23 * 60 + 59, Math.round(mins)));
        const h = Math.floor(clamped / 60);
        const m = clamped % 60;
        return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
      }

      function toActiveCurrency(amount, nativeCurrency) {
        const val = Number(amount) || 0;
        const active = state.settings.currency;
        const rate = Number(state.settings.exchangeRate) || 25.20;
        if (nativeCurrency === active) return val;
        if (nativeCurrency === 'EUR' && active === 'CZK') return val * rate;
        if (nativeCurrency === 'CZK' && active === 'EUR') return val / rate;
        return val;
      }

      function formatMoney(amount, currency = state.settings.currency) {
        const rounded = Math.round(Number(amount) || 0);
        const str = rounded.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '\u00A0');
        return currency === 'EUR' ? `${str}\u00A0€` : `${str}\u00A0Kč`;
      }

      function formatMoneyCompact(amount, currency = state.settings.currency) {
        const num = Number(amount) || 0;
        const abs = Math.abs(num);
        if (currency === 'EUR') {
          if (abs >= 1_000_000) return `${(num / 1_000_000).toFixed(2).replace('.', ',')}\u00A0M\u00A0€`;
          if (abs >= 1_000) return `${Math.round(num / 1_000)}\u00A0tis.\u00A0€`;
          return `${Math.round(num)}\u00A0€`;
        }
        if (abs >= 1_000_000) return `${(num / 1_000_000).toFixed(1).replace('.', ',')}\u00A0M\u00A0Kč`;
        if (abs >= 1_000) return `${Math.round(num / 1_000)}\u00A0tis.\u00A0Kč`;
        return `${Math.round(num)}\u00A0Kč`;
      }

      function escapeHtml(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function getInitials(name) {
        const parts = String(name || 'SP').replace(/\(.*?\)/g, '').trim().split(/\s+/).filter(Boolean);
        if (!parts.length) return 'SP';
        if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
        return (parts[0][0] + parts[1][0]).toUpperCase();
      }

      function getProject(id) { return state.projects.find(p => p.id === id) || null; }
      function getCompany(id) { return state.companies.find(c => c.id === id) || null; }
      function getStage(id) { return STAGES.find(s => s.id === id) || STAGES[0]; }

      function formatProjectLabel(p) {
        if (!p) return '';
        const tags = [];
        if (p.qiName) tags.push(`QI: ${p.qiName}`);
        if (p.pohodaName) tags.push(`Pohoda: ${p.pohodaName}`);
        return tags.length ? `${p.name} (${tags.join(' | ')})` : p.name;
      }

      // ========================================================================
      // TOAST S UNDO
      // ========================================================================
      function showToast(text, canUndo = false) {
        const bar = document.getElementById('toastBar');
        document.getElementById('toastText').textContent = text;
        document.getElementById('toastUndoBtn').style.display = canUndo ? 'inline-block' : 'none';
        bar.classList.add('show');
        clearTimeout(ui.toastTimer);
        ui.toastTimer = setTimeout(() => bar.classList.remove('show'), canUndo ? 6500 : 3200);
      }

      document.getElementById('toastUndoBtn').addEventListener('click', () => {
        if (ui.undoTasksSnapshot) {
          state.tasks = JSON.parse(ui.undoTasksSnapshot);
          ui.undoTasksSnapshot = null;
          saveState();
          document.getElementById('toastBar').classList.remove('show');
          renderAll();
          showToast('Akce byla vrácena zpět');
        }
      });

      // ========================================================================
      // SIDEBAR & TOPBAR
      // ========================================================================
      function renderSidebar() {
        document.getElementById('sidebarUserName').textContent = state.settings.userName || 'Správce (Autor)';
        document.getElementById('sidebarUserInitials').textContent = getInitials(state.settings.userName);

        const openTasks = state.tasks.filter(t => !t.completed);
        const overdueCount = openTasks.filter(t => getTaskColumn(t) === 'overdue').length;
        const todayCount = openTasks.filter(t => getTaskColumn(t) === 'today').length;
        const myTasksCount = openTasks.filter(t => (t.owner || '').toLowerCase() === (state.settings.userName || '').toLowerCase()).length;

        const navItems = [
          { id: 'tasks',     label: 'Úkoly',     count: openTasks.length, icon: '<polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>' },
          { id: 'calendar',  label: 'Kalendář',  count: null, icon: '<rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>' },
          { id: 'projects',  label: 'Projekty',  count: state.projects.length, icon: '<polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/>' },
          { id: 'companies', label: 'Firmy',     count: state.companies.length, icon: '<path d="M3 21h18"/><path d="M5 21V7l8-4v18"/><path d="M19 21V11l-6-4"/>' },
          { id: 'contacts',  label: 'Kontakty',  count: state.contacts.length, icon: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>' },
          { id: 'forecast',  label: 'Prognóza',  count: null, icon: '<polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/>' }
        ];

        const navEl = document.getElementById('mainNav');
        navEl.innerHTML = navItems.map(it => `
          <button class="nav-item ${ui.activeView === it.id ? 'active' : ''}" data-nav="${it.id}">
            <span class="nav-item-left">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${it.icon}</svg>
              <span>${it.label}</span>
            </span>
            ${it.count !== null ? `<span class="nav-badge">${it.count}</span>` : ''}
          </button>
        `).join('');

        navEl.querySelectorAll('[data-nav]').forEach(btn => {
          btn.addEventListener('click', () => {
            ui.activeView = btn.dataset.nav;
            document.getElementById('sidebar').classList.remove('mobile-open');
            renderAll();
          });
        });

        const shortcuts = [
          { id: 'mine',    label: 'Moje úkoly',    count: myTasksCount, cls: 'neutral' },
          { id: 'all',     label: 'Všechny úkoly', count: openTasks.length, cls: 'neutral' },
          { id: 'overdue', label: 'Po termínu',    count: overdueCount, cls: 'red' },
          { id: 'today',   label: 'Dnes',          count: todayCount, cls: 'blue' }
        ];

        const scEl = document.getElementById('taskShortcuts');
        scEl.innerHTML = shortcuts.map(sc => `
          <button class="shortcut-item ${ui.activeView === 'tasks' && ui.tasksFilter === sc.id ? 'active' : ''}" data-sc="${sc.id}">
            <span>${sc.label}</span>
            <span class="shortcut-badge ${sc.cls}">${sc.count}</span>
          </button>
        `).join('');

        scEl.querySelectorAll('[data-sc]').forEach(btn => {
          btn.addEventListener('click', () => {
            ui.activeView = 'tasks';
            ui.tasksFilter = btn.dataset.sc;
            document.getElementById('sidebar').classList.remove('mobile-open');
            renderAll();
          });
        });
      }

      function renderTopbar() {
        const meta = {
          tasks:     { title: 'Úkoly',     cta: '+ Nový úkol',    modal: 'new_task' },
          calendar:  { title: 'Kalendář',  cta: '+ Nový úkol',    modal: 'new_task' },
          projects:  { title: 'Projekty',  cta: '+ Nový projekt', modal: 'new_project' },
          companies: { title: 'Firmy',     cta: '+ Nová firma',   modal: 'new_company' },
          contacts:  { title: 'Kontakty',  cta: '+ Nový kontakt', modal: 'new_contact' },
          forecast:  { title: 'Prognóza',  cta: '+ Nový projekt', modal: 'new_project' }
        }[ui.activeView] || { title: 'Úkoly', cta: '+ Nový úkol', modal: 'new_task' };

        document.getElementById('topbarTitle').textContent = meta.title;
        const ctaBtn = document.getElementById('topbarPrimaryCta');
        ctaBtn.textContent = meta.cta;
        ctaBtn.dataset.modal = meta.modal;

        const ctrlEl = document.getElementById('topbarViewControls');
        if (ui.activeView === 'tasks') {
          ctrlEl.innerHTML = `
            <div class="view-toggle">
              <button class="view-toggle-btn ${ui.tasksViewMode === 'board' ? 'active' : ''}" data-tmode="board">Nástěnka</button>
              <button class="view-toggle-btn ${ui.tasksViewMode === 'list' ? 'active' : ''}" data-tmode="list">Seznam</button>
            </div>
          `;
          ctrlEl.querySelectorAll('[data-tmode]').forEach(b => {
            b.addEventListener('click', () => {
              ui.tasksViewMode = b.dataset.tmode;
              renderAll();
            });
          });
        } else {
          ctrlEl.innerHTML = '';
        }

        document.getElementById('currCzkBtn').classList.toggle('active', state.settings.currency === 'CZK');
        document.getElementById('currEurBtn').classList.toggle('active', state.settings.currency === 'EUR');
        document.getElementById('rateBtn').textContent = `${Number(state.settings.exchangeRate).toFixed(2).replace('.', ',')} Kč/€`;
      }

      // ========================================================================
      // SEKCE 1: ÚKOLY (CHYTRÝ BOARD + ČASOVÁ OSA DNES + SEZNAM)
      // ========================================================================
      function computeTodaySchedule(todayTasks) {
        let cursor = 8 * 60; // 08:00
        return todayTasks.map(task => {
          const dur = Number(task.duration) || 30;
          const pref = timeStrToMins(task.startTime);
          const start = (pref !== null && pref >= cursor) ? pref : cursor;
          const end = start + dur;
          cursor = end + 15;
          return {
            task,
            startMins: start,
            endMins: end,
            startStr: minsToTimeStr(start),
            endStr: minsToTimeStr(end)
          };
        });
      }

      function getFilteredTasks() {
        let list = [...state.tasks];
        if (ui.tasksFilter === 'mine') {
          const me = (state.settings.userName || '').toLowerCase();
          list = list.filter(t => (t.owner || '').toLowerCase() === me);
        } else if (ui.tasksFilter === 'overdue') {
          list = list.filter(t => getTaskColumn(t) === 'overdue');
        } else if (ui.tasksFilter === 'today') {
          list = list.filter(t => getTaskColumn(t) === 'today');
        }
        return list;
      }

      function renderTasksView() {
        const container = document.getElementById('viewContainer');
        const filtered = getFilteredTasks();
        const openCount = state.tasks.filter(t => !t.completed).length;
        const doneCount = state.tasks.filter(t => t.completed).length;
        const overdueCount = state.tasks.filter(t => !t.completed && getTaskColumn(t) === 'overdue').length;

        const filterLabels = {
          all: 'Všechny úkoly',
          mine: 'Moje úkoly',
          overdue: 'Po termínu',
          today: 'Dnes'
        };

        const subToolbar = `
          <div class="sub-toolbar">
            <div class="sub-toolbar-stats tabular">
              <span>Filtr: <strong>${filterLabels[ui.tasksFilter]}</strong></span>
              <span>·</span>
              <span>Otevřené: <strong>${openCount}</strong></span>
              <span>·</span>
              <span style="color:${overdueCount ? 'var(--red-600)' : 'inherit'};">Po termínu: <strong>${overdueCount}</strong></span>
              <span>·</span>
              <span style="color:var(--emerald-700);">Splněné: <strong>${doneCount}</strong></span>
            </div>
            <div style="font-size:12px; color:var(--text-muted);">
              Přetažením karty do <strong>Dnes</strong> vytvoříte časový blok · kliknutím na projekt přejdete do detailu projektu
            </div>
          </div>
        `;

        if (state.tasks.length === 0) {
          container.innerHTML = `
            ${subToolbar}
            <div class="view-scroll">
              <div class="empty-state">
                <div class="empty-icon">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
                </div>
                <div class="empty-title">Zatím nemáte žádné úkoly</div>
                <div class="empty-desc">
                  Začněte založením prvního úkolu s přesným datem a volitelnou vazbou na projekt. Úkoly se automaticky zařadí do sloupců podle termínu i do kalendáře.
                </div>
                <div style="display:flex; justify-content:center; gap:8px; flex-wrap:wrap;">
                  <button class="btn-emerald" id="emptyNewTaskBtn">+ Nový úkol</button>
                  <button class="btn-secondary" id="emptyGoProjectsBtn">+ Založit projekt</button>
                </div>
              </div>
            </div>
          `;
          document.getElementById('emptyNewTaskBtn').addEventListener('click', () => openModal('new_task', { dueDate: getTodayStr() }));
          document.getElementById('emptyGoProjectsBtn').addEventListener('click', () => openModal('new_project'));
          return;
        }

        if (ui.tasksViewMode === 'board') {
          const colsHtml = TASK_COLUMNS.map(col => {
            const colTasks = filtered
              .filter(t => getTaskColumn(t) === col.id)
              .sort((a, b) => (a.order || 0) - (b.order || 0) || (a.dueDate || '').localeCompare(b.dueDate || ''));

            const isToday = col.id === 'today';
            const prefillDate = col.id === 'overdue' ? addDaysYMD(getTodayStr(), -1)
              : col.id === 'today' ? getTodayStr()
              : col.id === 'tomorrow' ? addDaysYMD(getTodayStr(), 1)
              : col.id === 'this_week' ? addDaysYMD(getTodayStr(), 3)
              : addDaysYMD(getTodayStr(), 10);

            let bodyHtml = '';
            if (isToday) {
              const scheduled = computeTodaySchedule(colTasks);
              bodyHtml += `
                <div class="timeline-axis-note tabular">
                  <span>Časová osa 08:00 – 17:00</span>
                  <span>📅 ${formatDateCZ(getTodayStr())}</span>
                </div>
              `;
              if (scheduled.length === 0) {
                bodyHtml += `<div class="board-col-empty">Přetáhněte sem libovolný úkol a promění se v časový blok.</div>`;
              } else {
                scheduled.forEach((slot, idx) => {
                  const t = slot.task;
                  const typeMeta = TASK_TYPES[t.type] || TASK_TYPES.call;
                  const proj = getProject(t.projectId);
                  bodyHtml += `
                    <div class="time-block-row" data-slot-index="${idx}">
                      <div class="time-gutter">${slot.startStr}</div>
                      <div class="time-block-card ${typeMeta.tb} ${t.completed ? 'completed' : ''}"
                           draggable="true"
                           data-task-id="${t.id}"
                           data-task-col="today"
                           data-open-task="${t.id}">
                        <div class="task-top">
                          <button class="task-check ${t.completed ? 'checked' : ''}" data-toggle-task="${t.id}" title="Splnit úkol">
                            ${t.completed ? '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>' : ''}
                          </button>
                          <div class="tb-title">${escapeHtml(t.title)}</div>
                        </div>
                        <div class="tb-sub tabular">
                          <span>${slot.startStr}–${slot.endStr} (${t.duration}m)</span>
                          <span>📅 ${formatDateCZ(t.dueDate)}</span>
                          ${proj ? `<span class="tb-pill" data-jump-project="${proj.id}" title="Otevřít projekt">📁 ${escapeHtml(proj.name)}</span>` : ''}
                        </div>
                      </div>
                    </div>
                  `;
                });
              }
              const nextFree = scheduled.length ? minsToTimeStr(scheduled[scheduled.length - 1].endMins + 15) : '08:00';
              bodyHtml += `
                <div class="timeline-hours-ref tabular">
                  <span>Volno od ${nextFree}</span>
                  <span>→ 17:00</span>
                </div>
              `;
            } else {
              if (colTasks.length === 0) {
                bodyHtml = `<div class="board-col-empty">Žádné úkoly v tomto sloupci</div>`;
              } else {
                bodyHtml = colTasks.map((t, idx) => {
                  const typeMeta = TASK_TYPES[t.type] || TASK_TYPES.call;
                  const proj = getProject(t.projectId);
                  return `
                    <div class="task-card accent-${col.id} ${t.completed ? 'completed' : ''}"
                         draggable="true"
                         data-task-id="${t.id}"
                         data-task-col="${col.id}"
                         data-open-task="${t.id}"
                         data-slot-index="${idx}">
                      <div class="task-top">
                        <button class="task-check ${t.completed ? 'checked' : ''}" data-toggle-task="${t.id}" title="Splnit úkol">
                          ${t.completed ? '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>' : ''}
                        </button>
                        <div class="task-title">${escapeHtml(t.title)}</div>
                      </div>
                      <div class="task-meta-row">
                        <span class="date-chip ${col.id === 'overdue' ? 'overdue' : ''}">📅 ${formatDateCZ(t.dueDate)}${t.startTime ? ' · ' + escapeHtml(t.startTime) : ''}</span>
                        ${proj ? `<button class="project-link-pill" data-jump-project="${proj.id}" title="Přejít na projekt">📁 ${escapeHtml(proj.name)}</button>` : ''}
                      </div>
                      <div class="task-footer-row">
                        <span class="type-badge ${typeMeta.badge}">${typeMeta.label} · ${t.duration} min</span>
                        <span>${escapeHtml(t.owner || state.settings.userName)}</span>
                      </div>
                    </div>
                  `;
                }).join('');
              }
            }

            return `
              <div class="board-col ${isToday ? 'col-today' : ''}" data-drop-col="${col.id}">
                <div class="board-col-header">
                  <div class="col-title-group">
                    <span class="col-dot" style="background:${col.dot};"></span>
                    <span class="col-title">${col.label}</span>
                    <span class="col-count">${colTasks.length}</span>
                  </div>
                  <button class="col-add-btn" data-add-col-date="${prefillDate}" title="Přidat úkol do: ${col.label}">+</button>
                </div>
                <div class="board-col-body" data-col-body="${col.id}">${bodyHtml}</div>
                <div class="board-col-footer">${isToday ? 'Přetáhněte sem pro časový blok' : 'Přetáhněte sem pro přeplánování'}</div>
              </div>
            `;
          }).join('');

          container.innerHTML = `${subToolbar}<div class="board-grid">${colsHtml}</div>`;
          bindTaskBoardEvents(container);
        } else {
          // SEZNAM (LIST VIEW)
          const sorted = [...filtered].sort((a, b) => (a.dueDate || '').localeCompare(b.dueDate || ''));
          const rowsHtml = sorted.map(t => {
            const colId = getTaskColumn(t);
            const typeMeta = TASK_TYPES[t.type] || TASK_TYPES.call;
            const proj = getProject(t.projectId);
            return `
              <tr data-open-task="${t.id}" style="${t.completed ? 'opacity:0.58;' : ''}">
                <td style="width:40px;" onclick="event.stopPropagation()">
                  <button class="task-check ${t.completed ? 'checked' : ''}" data-toggle-task="${t.id}">
                    ${t.completed ? '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>' : ''}
                  </button>
                </td>
                <td style="font-weight:600; ${t.completed ? 'text-decoration:line-through;' : ''}">${escapeHtml(t.title)}</td>
                <td><span class="date-chip ${colId === 'overdue' ? 'overdue' : colId === 'today' ? 'today' : ''}">📅 ${formatDateCZ(t.dueDate)}${t.startTime ? ' · ' + escapeHtml(t.startTime) : ''}</span></td>
                <td><span class="type-badge ${typeMeta.badge}">${typeMeta.label} (${t.duration}m)</span></td>
                <td onclick="event.stopPropagation()">
                  ${proj ? `<button class="project-link-pill" data-jump-project="${proj.id}">📁 ${escapeHtml(proj.name)}</button>` : '<span style="color:var(--text-light);">—</span>'}
                </td>
                <td>${escapeHtml(t.owner || state.settings.userName)}</td>
              </tr>
            `;
          }).join('');

          container.innerHTML = `
            ${subToolbar}
            <div class="view-scroll page-pad">
              <div class="card-surface">
                <div class="table-wrap">
                  <table class="crm-table">
                    <thead>
                      <tr>
                        <th></th>
                        <th>Úkol</th>
                        <th>Datum & čas</th>
                        <th>Typ / Trvání</th>
                        <th>Vazba na projekt</th>
                        <th>Vlastník</th>
                      </tr>
                    </thead>
                    <tbody>
                      ${rowsHtml || `<tr><td colspan="6" style="text-align:center; padding:32px; color:var(--text-muted);">Žádné úkoly neodpovídají zvolenému filtru.</td></tr>`}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          `;
          bindCommonTaskInteractions(container);
        }
      }

      function bindCommonTaskInteractions(container) {
        container.querySelectorAll('[data-toggle-task]').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const t = state.tasks.find(x => x.id === btn.dataset.toggleTask);
            if (!t) return;
            t.completed = !t.completed;
            saveState();
            renderAll();
            showToast(t.completed ? `Úkol „${t.title}“ označen jako splněný` : `Úkol „${t.title}“ znovu otevřen`);
          });
        });

        container.querySelectorAll('[data-jump-project]').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const pid = btn.dataset.jumpProject;
            ui.activeView = 'projects';
            renderAll();
            openDrawer('project', pid);
          });
        });

        container.querySelectorAll('[data-open-task]').forEach(el => {
          el.addEventListener('click', () => openDrawer('task', el.dataset.openTask));
        });

        container.querySelectorAll('[data-add-col-date]').forEach(btn => {
          btn.addEventListener('click', () => openModal('new_task', { dueDate: btn.dataset.addColDate }));
        });
      }

      function bindTaskBoardEvents(container) {
        bindCommonTaskInteractions(container);

        const draggables = container.querySelectorAll('[draggable="true"][data-task-id]');
        const cols = container.querySelectorAll('[data-drop-col]');

        function clearDragState() {
          container.querySelectorAll('.drop-preview-slot').forEach(p => p.remove());
          cols.forEach(c => c.classList.remove('drag-over'));
        }

        draggables.forEach(el => {
          el.addEventListener('dragstart', (e) => {
            ui.dragTaskId = el.dataset.taskId;
            ui.dragSourceCol = el.dataset.taskCol;
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', ui.dragTaskId);
            setTimeout(() => el.classList.add('dragging'), 0);
          });
          el.addEventListener('dragend', () => {
            el.classList.remove('dragging');
            clearDragState();
            ui.dragTaskId = null;
            ui.dragSourceCol = null;
            ui.dropInsertIndex = null;
          });
        });

        cols.forEach(colEl => {
          const colId = colEl.dataset.dropCol;
          const bodyEl = colEl.querySelector('[data-col-body]');

          colEl.addEventListener('dragover', (e) => {
            e.preventDefault();
            if (!ui.dragTaskId) return;
            cols.forEach(c => { if (c !== colEl) c.classList.remove('drag-over'); });
            colEl.classList.add('drag-over');

            if (colId === 'today') {
              const rows = Array.from(bodyEl.querySelectorAll('.time-block-row'));
              let idx = rows.length;
              for (let i = 0; i < rows.length; i++) {
                const r = rows[i].getBoundingClientRect();
                if (e.clientY < r.top + r.height / 2) { idx = i; break; }
              }
              ui.dropInsertIndex = idx;

              const existing = state.tasks
                .filter(t => getTaskColumn(t) === 'today' && t.id !== ui.dragTaskId)
                .sort((a, b) => (a.order || 0) - (b.order || 0));

              let cursor = 8 * 60;
              for (let i = 0; i < Math.min(idx, existing.length); i++) {
                cursor += (Number(existing[i].duration) || 30) + 15;
              }
              const dragged = state.tasks.find(t => t.id === ui.dragTaskId);
              const dur = dragged ? (Number(dragged.duration) || 30) : 30;

              let prev = bodyEl.querySelector('.drop-preview-slot');
              if (!prev) {
                container.querySelectorAll('.drop-preview-slot').forEach(p => p.remove());
                prev = document.createElement('div');
                prev.className = 'drop-preview-slot';
              }
              prev.innerHTML = `
                <div class="time-gutter" style="color:var(--blue-600); padding-top:0;">${minsToTimeStr(cursor)}</div>
                <div class="drop-preview-box">
                  <span>Vložit časový blok</span>
                  <span class="tabular">${minsToTimeStr(cursor)}–${minsToTimeStr(cursor + dur)}</span>
                </div>
              `;
              const refEl = bodyEl.querySelector('.timeline-hours-ref');
              if (idx < rows.length) bodyEl.insertBefore(prev, rows[idx]);
              else if (refEl) bodyEl.insertBefore(prev, refEl);
              else bodyEl.appendChild(prev);
            } else {
              container.querySelectorAll('.drop-preview-slot').forEach(p => p.remove());
              ui.dropInsertIndex = null;
            }
          });

          colEl.addEventListener('dragleave', (e) => {
            if (!colEl.contains(e.relatedTarget)) {
              colEl.classList.remove('drag-over');
              if (colId === 'today') bodyEl.querySelectorAll('.drop-preview-slot').forEach(p => p.remove());
            }
          });

          colEl.addEventListener('drop', (e) => {
            e.preventDefault();
            const taskId = ui.dragTaskId || e.dataTransfer.getData('text/plain');
            const task = state.tasks.find(t => t.id === taskId);
            clearDragState();
            if (!task) return;

            ui.undoTasksSnapshot = JSON.stringify(state.tasks);

            const today = getTodayStr();
            if (colId === 'overdue') task.dueDate = addDaysYMD(today, -1);
            else if (colId === 'today') task.dueDate = today;
            else if (colId === 'tomorrow') task.dueDate = addDaysYMD(today, 1);
            else if (colId === 'this_week') task.dueDate = addDaysYMD(today, 3);
            else task.dueDate = addDaysYMD(today, 10);

            if (colId !== 'today') {
              // Convert back to card without forced reflow time
              task.startTime = '';
            }

            const siblings = state.tasks
              .filter(t => getTaskColumn(t) === colId && t.id !== task.id)
              .sort((a, b) => (a.order || 0) - (b.order || 0));

            const insertAt = (colId === 'today' && ui.dropInsertIndex !== null)
              ? Math.max(0, Math.min(ui.dropInsertIndex, siblings.length))
              : siblings.length;

            siblings.splice(insertAt, 0, task);
            siblings.forEach((t, i) => { t.order = i; });

            // Automatic time reflow for Today
            if (colId === 'today') {
              let cursor = 8 * 60;
              siblings.forEach(t => {
                t.startTime = minsToTimeStr(cursor);
                cursor += (Number(t.duration) || 30) + 15;
              });
            }

            saveState();
            renderAll();
            const colLabel = TASK_COLUMNS.find(c => c.id === colId).label;
            showToast(`Úkol „${task.title}“ přesunut na ${colLabel} (${formatDateCZ(task.dueDate)})`, true);
          });
        });
      }

      // ========================================================================
      // SEKCE 2: KALENDÁŘ
      // ========================================================================
      function renderCalendarView() {
        const container = document.getElementById('viewContainer');
        const year = ui.calYear;
        const month = ui.calMonth;
        const todayStr = getTodayStr();

        const firstDay = new Date(year, month, 1);
        const startOffset = (firstDay.getDay() + 6) % 7; // Monday = 0
        const gridStart = new Date(year, month, 1 - startOffset);

        const cells = [];
        for (let i = 0; i < 42; i++) {
          const d = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + i);
          const ymd = toYMD(d);
          const isCurrentMonth = d.getMonth() === month;
          const dayTasks = state.tasks
            .filter(t => t.dueDate === ymd)
            .sort((a, b) => (a.startTime || '99:99').localeCompare(b.startTime || '99:99'));
          const dayProjects = ui.calShowProjectClose
            ? state.projects.filter(p => p.targetCloseDate === ymd)
            : [];

          const chipsHtml = [
            ...dayTasks.map(t => {
              const tm = TASK_TYPES[t.type] || TASK_TYPES.call;
              const proj = getProject(t.projectId);
              return `<div class="cal-chip ${tm.chip} ${t.completed ? 'completed' : ''}" data-cal-task="${t.id}" title="${escapeHtml(t.title)}${proj ? ' · ' + escapeHtml(proj.name) : ''}">${t.startTime ? escapeHtml(t.startTime) + ' ' : ''}${escapeHtml(t.title)}</div>`;
            }),
            ...dayProjects.map(p => `<div class="cal-chip project-close" data-cal-proj="${p.id}" title="Termín uzavření projektu: ${escapeHtml(p.name)}">🏁 ${escapeHtml(p.name)}</div>`)
          ].slice(0, 4).join('');

          const extraCount = (dayTasks.length + dayProjects.length) - 4;

          cells.push(`
            <div class="cal-day ${!isCurrentMonth ? 'other-month' : ''} ${ymd === todayStr ? 'is-today' : ''} ${ymd === ui.calSelectedDate ? 'selected' : ''}" data-cal-day="${ymd}">
              <div class="cal-day-top">
                <span class="cal-day-num tabular">${d.getDate()}</span>
                <button class="cal-day-add" data-cal-add="${ymd}" title="Nový úkol na ${formatDateCZ(ymd)}">+</button>
              </div>
              ${chipsHtml}
              ${extraCount > 0 ? `<div style="font-size:10.5px; color:var(--text-muted); font-weight:600;">+${extraCount} další</div>` : ''}
            </div>
          `);
        }

        const selDate = ui.calSelectedDate;
        const selTasks = state.tasks
          .filter(t => t.dueDate === selDate)
          .sort((a, b) => (a.startTime || '99:99').localeCompare(b.startTime || '99:99'));
        const selProjects = ui.calShowProjectClose
          ? state.projects.filter(p => p.targetCloseDate === selDate)
          : [];

        const agendaItemsHtml = [
          ...selTasks.map(t => {
            const tm = TASK_TYPES[t.type] || TASK_TYPES.call;
            const proj = getProject(t.projectId);
            return `
              <div class="task-card ${t.completed ? 'completed' : ''}" style="border-top-width:3px;" data-open-task="${t.id}">
                <div class="task-top">
                  <button class="task-check ${t.completed ? 'checked' : ''}" data-toggle-task="${t.id}">
                    ${t.completed ? '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>' : ''}
                  </button>
                  <div class="task-title">${escapeHtml(t.title)}</div>
                </div>
                <div class="task-meta-row">
                  <span class="type-badge ${tm.badge}">${tm.label} · ${t.startTime || 'Celý den'} (${t.duration}m)</span>
                  ${proj ? `<button class="project-link-pill" data-jump-project="${proj.id}">📁 ${escapeHtml(proj.name)}</button>` : ''}
                </div>
              </div>
            `;
          }),
          ...selProjects.map(p => `
            <div class="linked-list-item" data-jump-project="${p.id}" style="border-left:3px solid var(--amber-500);">
              <div>
                <div style="font-weight:700;">🏁 Uzavření: ${escapeHtml(p.name)}</div>
                <div style="font-size:11px; color:var(--text-muted);">${formatMoney(toActiveCurrency(p.value, p.nativeCurrency))}</div>
              </div>
              <span class="code-badge">${getStage(p.stage).label}</span>
            </div>
          `)
        ].join('');

        container.innerHTML = `
          <div class="calendar-layout">
            <div class="calendar-card">
              <div class="calendar-header">
                <div style="display:flex; align-items:center; gap:8px;">
                  <button class="btn-secondary" id="calPrevBtn" style="height:30px; padding:0 10px;">←</button>
                  <button class="btn-secondary" id="calTodayBtn" style="height:30px; font-size:12px;">Dnes</button>
                  <button class="btn-secondary" id="calNextBtn" style="height:30px; padding:0 10px;">→</button>
                  <div class="calendar-month-title" style="margin-left:6px;">${CZ_MONTHS[month]} ${year}</div>
                </div>
                <label style="display:flex; align-items:center; gap:7px; font-size:12px; color:var(--text-secondary); cursor:pointer;">
                  <input type="checkbox" id="calToggleProjects" ${ui.calShowProjectClose ? 'checked' : ''} />
                  Zobrazit termíny uzavření projektů
                </label>
              </div>
              <div class="calendar-weekdays">
                <div class="calendar-weekday">Po</div>
                <div class="calendar-weekday">Út</div>
                <div class="calendar-weekday">St</div>
                <div class="calendar-weekday">Čt</div>
                <div class="calendar-weekday">Pá</div>
                <div class="calendar-weekday">So</div>
                <div class="calendar-weekday">Ne</div>
              </div>
              <div class="calendar-grid">${cells.join('')}</div>
            </div>

            <div class="agenda-card">
              <div class="agenda-header">
                <div>
                  <div style="font-weight:700; font-size:14px;">Agenda dne</div>
                  <div style="font-size:12px; color:var(--text-muted);" class="tabular">📅 ${formatDateCZ(selDate)}</div>
                </div>
                <button class="btn-emerald" id="agendaAddBtn" style="height:30px; padding:0 10px; font-size:12px;">+ Úkol</button>
              </div>
              <div class="agenda-body">
                ${agendaItemsHtml || `<div style="text-align:center; padding:28px 12px; color:var(--text-muted); font-size:12.5px;">Na datum ${formatDateCZ(selDate)} nemáte naplánované žádné úkoly.</div>`}
              </div>
            </div>
          </div>
        `;

        document.getElementById('calPrevBtn').addEventListener('click', () => {
          ui.calMonth--;
          if (ui.calMonth < 0) { ui.calMonth = 11; ui.calYear--; }
          renderCalendarView();
        });
        document.getElementById('calNextBtn').addEventListener('click', () => {
          ui.calMonth++;

      // SEKCE 3: PROJEKTY (QI NÁZEV & POHODA NÁZEV)
      // ========================================================================
      function renderProjectsView() {
        const container = document.getElementById('viewContainer');

        if (state.projects.length === 0) {
          container.innerHTML = `
            <div class="view-scroll">
              <div class="empty-state">
                <div class="empty-icon">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
                </div>
                <div class="empty-title">Zatím nejsou evidovány žádné projekty</div>
                <div class="empty-desc">
                  Založte první obchodní projekt včetně polí <strong>QI název</strong> a <strong>Pohoda název</strong>. Na projekty pak můžete přímo navazovat úkoly.
                </div>
                <button class="btn-emerald" id="emptyNewProjectBtn">+ Nový projekt</button>
              </div>
            </div>
          `;
          document.getElementById('emptyNewProjectBtn').addEventListener('click', () => openModal('new_project'));
          return;
        }

        const all = state.projects;
        const wonProjects = all.filter(p => p.stage === 'won');
        const openProjects = all.filter(p => p.stage !== 'won');

        const totalAll = all.reduce((s, p) => s + toActiveCurrency(p.value, p.nativeCurrency), 0);
        const wonVal = wonProjects.reduce((s, p) => s + toActiveCurrency(p.value, p.nativeCurrency), 0);
        const openWeighted = openProjects.reduce((s, p) => s + toActiveCurrency(p.value, p.nativeCurrency) * ((Number(p.probability) || 0) / 100), 0);
        const target = Math.max(1, toActiveCurrency(state.settings.quarterTargetCZK, 'CZK'));

        const ticksTotal = 36;
        const wonTicks = Math.min(ticksTotal, Math.round((wonVal / target) * ticksTotal));
        const likelyTicks = Math.min(ticksTotal, Math.round(((wonVal + openWeighted) / target) * ticksTotal));
        let ticksHtml = '';
        for (let i = 0; i < ticksTotal; i++) {
          ticksHtml += `<div class="tick ${i < wonTicks ? 'won' : i < likelyTicks ? 'likely' : ''}"></div>`;
        }

        const legendHtml = STAGES.map(st => {
          const sum = all.filter(p => p.stage === st.id).reduce((s, p) => s + toActiveCurrency(p.value, p.nativeCurrency), 0);
          return `
            <button class="stage-legend-btn ${ui.projectsStageFilter === st.id ? 'active' : ''}" data-pstage="${st.id}">
              <span class="col-dot" style="background:${st.color};"></span>
              <span style="font-weight:600;">${st.label}</span>
              <span class="tabular" style="color:var(--text-muted);">${formatMoneyCompact(sum)}</span>
            </button>
          `;
        }).join('');

        const segsHtml = STAGES.map(st => {
          const sum = all.filter(p => p.stage === st.id).reduce((s, p) => s + toActiveCurrency(p.value, p.nativeCurrency), 0);
          if (sum <= 0 || totalAll <= 0) return '';
          const pct = Math.max(2, (sum / totalAll) * 100);
          const dim = ui.projectsStageFilter !== 'all' && ui.projectsStageFilter !== st.id;
          return `<div class="pipeline-seg" data-pstage="${st.id}" style="width:${pct}%; background:${st.color}; opacity:${dim ? 0.25 : 1};" title="${st.label}: ${formatMoney(sum)}"></div>`;
        }).join('');

        let list = [...all];
        if (ui.projectsTab === 'open') list = list.filter(p => p.stage !== 'won');
        if (ui.projectsTab === 'won')  list = list.filter(p => p.stage === 'won');
        if (ui.projectsStageFilter !== 'all') list = list.filter(p => p.stage === ui.projectsStageFilter);

        const viewVal = list.reduce((s, p) => s + toActiveCurrency(p.value, p.nativeCurrency), 0);
        const viewWeighted = list.reduce((s, p) => s + toActiveCurrency(p.value, p.nativeCurrency) * ((Number(p.probability) || 0) / 100), 0);
        const avgProb = list.length ? Math.round(list.reduce((s, p) => s + (Number(p.probability) || 0), 0) / list.length) : 0;

        const rowsHtml = list.map(p => {
          const st = getStage(p.stage);
          const comp = getCompany(p.companyId);
          const tasksCount = state.tasks.filter(t => t.projectId === p.id && !t.completed).length;
          return `
            <tr data-open-project="${p.id}">
              <td>
                <div style="font-weight:700; color:var(--text-primary);">${escapeHtml(p.name)}</div>
                <div style="font-size:11.5px; color:var(--text-muted);">${comp ? escapeHtml(comp.name) : 'Bez přiřazené firmy'}</div>
              </td>
              <td>${p.qiName ? `<span class="code-badge qi">${escapeHtml(p.qiName)}</span>` : '<span style="color:var(--text-light);">—</span>'}</td>
              <td>${p.pohodaName ? `<span class="code-badge pohoda">${escapeHtml(p.pohodaName)}</span>` : '<span style="color:var(--text-light);">—</span>'}</td>
              <td><span class="stage-pill" style="background:${st.bg}; color:${st.fg};"><span class="col-dot" style="background:${st.color};"></span>${st.label}</span></td>
              <td class="tabular" style="text-align:right; font-weight:700;">${formatMoney(toActiveCurrency(p.value, p.nativeCurrency))}</td>
              <td class="tabular" style="font-weight:600;">${p.probability}\u00A0%</td>
              <td class="tabular">${p.targetCloseDate ? '📅 ' + formatDateCZ(p.targetCloseDate) : '—'}</td>
              <td class="tabular">${tasksCount} otevř.</td>
            </tr>
          `;
        }).join('');

        container.innerHTML = `
          <div class="view-scroll page-pad">
            <div class="pipeline-header-grid">
              <div class="pipeline-box">
                <div class="stage-legend">${legendHtml}</div>
                <div class="pipeline-bar">${segsHtml}</div>
              </div>
              <div class="pipeline-box">
                <div style="display:flex; justify-content:space-between; font-size:12px;">
                  <span style="color:var(--text-muted);">Kvartální cíl: <strong class="tabular" style="color:var(--text-primary);">${formatMoneyCompact(target)}</strong></span>
                  <span class="tabular" style="color:var(--emerald-700); font-weight:700;">${formatMoneyCompact(wonVal)} vyhráno</span>
                </div>
                <div class="tick-bar">${ticksHtml}</div>
                <div style="margin-top:6px; font-size:11.5px; color:var(--text-muted);" class="tabular">
                  Očekávané plnění (vyhráno + vážená pipeline): <strong>${formatMoneyCompact(wonVal + openWeighted)}</strong>
                </div>
              </div>
            </div>

            <div class="card-surface">
              <div class="table-toolbar">
                <div class="tabs-bar">
                  <button class="tab-pill ${ui.projectsTab === 'all' ? 'active' : ''}" data-ptab="all">Vše (${all.length})</button>
                  <button class="tab-pill ${ui.projectsTab === 'open' ? 'active' : ''}" data-ptab="open">Otevřené (${openProjects.length})</button>
                  <button class="tab-pill ${ui.projectsTab === 'won' ? 'active' : ''}" data-ptab="won">Vyhráno (${wonProjects.length})</button>
                </div>
                <button class="btn-secondary" id="exportProjectsCsvBtn" style="height:30px; font-size:12px;">Export CSV</button>
              </div>
              <div class="table-wrap">
                <table class="crm-table">
                  <thead>
                    <tr>
                      <th>Projekt / Firma</th>
                      <th>QI název</th>
                      <th>Pohoda název</th>
                      <th>Fáze</th>
                      <th style="text-align:right;">Hodnota</th>
                      <th>Pravděp.</th>
                      <th>Termín uzavření</th>
                      <th>Úkoly</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${rowsHtml || `<tr><td colspan="8" style="text-align:center; padding:32px; color:var(--text-muted);">Žádné projekty v tomto filtru.</td></tr>`}
                  </tbody>
                </table>
              </div>
              <div class="summary-footer tabular">
                <div style="display:flex; gap:18px; flex-wrap:wrap;">
                  <span>Počet: <strong>${list.length}</strong></span>
                  <span>Celkem: <strong>${formatMoney(viewVal)}</strong></span>
                  <span>Vážená hodnota: <strong>${formatMoney(viewWeighted)}</strong></span>
                  <span>Prům. pravděpodobnost: <strong>${avgProb}\u00A0%</strong></span>
                </div>
                <span>Měna: <strong>${state.settings.currency}</strong></span>
              </div>
            </div>
          </div>
        `;

        container.querySelectorAll('[data-pstage]').forEach(el => {
          el.addEventListener('click', () => {
            ui.projectsStageFilter = ui.projectsStageFilter === el.dataset.pstage ? 'all' : el.dataset.pstage;
            renderProjectsView();
          });
        });
        container.querySelectorAll('[data-ptab]').forEach(el => {
          el.addEventListener('click', () => {
            ui.projectsTab = el.dataset.ptab;
            renderProjectsView();
          });
        });
        container.querySelectorAll('[data-open-project]').forEach(row => {
          row.addEventListener('click', () => openDrawer('project', row.dataset.openProject));
        });
        document.getElementById('exportProjectsCsvBtn').addEventListener('click', () => exportProjectsCSV(list));
      }
